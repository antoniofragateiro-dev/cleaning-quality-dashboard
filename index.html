function ratCol(r){ if(r==null) return ''; if(r>=9) return 'background:var(--grnbg);color:var(--grn)';
  if(r>=8.5) return '' ; if(r>=8) return 'background:var(--ambbg);color:var(--amb)';
  return 'background:var(--redbg);color:var(--red)'; }
const pct=v=>v==null?'—':v+'%';

/* ---------- Summary ---------- */
function renderSum(){
  const t=PORTFOLIO.reduce((a,p)=>a+p.wkTotal,0), d=PORTFOLIO.reduce((a,p)=>a+p.wkDelayed,0);
  const avg=t?Math.round(d/t*100):null;
  const high=PORTFOLIO.filter(p=>(p.wkPct||0)>=30);
  const r4=PORTFOLIO.filter(p=>p.r4Pct!=null);
  const r4avg=r4.length?Math.round(r4.reduce((a,p)=>a+p.r4Pct,0)/r4.length):null;
  const cards=`<div class="cards">
    <div class="card"><div class="k">Properties</div><div class="v">${PORTFOLIO.length}</div><div class="n">2 Numa · ${PORTFOLIO.length-2} LSA</div></div>
    <div class="card"><div class="k">Delay rate — last week</div><div class="v">${pct(avg)}</div><div class="n">${d} of ${t} cleans finished ≥ 15:00</div></div>
    <div class="card"><div class="k">4-week average</div><div class="v">${pct(r4avg)}</div><div class="n">rolling, all weekdays</div></div>
    <div class="card"><div class="k">Properties ≥ 30%</div><div class="v">${high.length}</div><div class="n">last week</div></div>
    <div class="card"><div class="k">Checklist callbacks</div><div class="v">${CHECKLIST_META.anjosCallbacks}</div><div class="n">of ${CHECKLIST_META.anjosRows} inspections</div></div>
  </div>`;
  const sorted=[...PORTFOLIO].sort((a,b)=>(b.wkPct??-1)-(a.wkPct??-1));
  const rows=sorted.map(p=>{
    const delta=(p.curPct!=null&&p.prevPct!=null)?p.curPct-p.prevPct:null;
    return `<tr><td>${bdg(p.brand)}${esc(p.prop)}</td>
      <td class="num">${p.wkTotal}</td>
      <td class="cell" style="${heatCol(p.wkPct)}">${pct(p.wkPct)}</td>
      <td class="cell" style="${heatCol(p.r4Pct)}">${pct(p.r4Pct)}</td>
      <td class="cell" style="${heatCol(p.curPct)}">${pct(p.curPct)}</td>
      <td class="num" style="color:${delta==null?'var(--mut)':(delta>0?'var(--red)':'var(--grn)')}">${delta==null?'—':(delta>0?'+':'')+delta+'pp'}</td></tr>`;
  }).join('');
  $('#p-sum').innerHTML=cards+`<div class="box"><h3>Delay rate by property</h3>
    <table><thead><tr><th>Property</th><th class="num">Cleans (wk)</th><th style="text-align:center">Last week</th>
    <th style="text-align:center">4-wk avg</th><th style="text-align:center">Aug MTD</th><th class="num">vs Jul</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="legend"><span><span class="sw" style="background:var(--grnbg)"></span>&lt;15%</span>
    <span><span class="sw" style="background:#fffbeb"></span>15–29%</span>
    <span><span class="sw" style="background:var(--ambbg)"></span>30–49%</span>
    <span><span class="sw" style="background:var(--redbg)"></span>≥50%</span></div>
    <div class="note">A cleaning is "delayed" when the first FOR_INSPECTION / CLEAN event for that unit-day lands at or after 15:00 local. Source: dbt_models.shine_task_processed_s. Week ${WEEK_START} – ${WEEK_END}.</div></div>`;
}

/* ---------- Cleaners ---------- */
function renderClean(){
  if(!CLEANERS.length){ $('#p-clean').innerHTML='<div class="empty">No cleaner data available.</div>'; return; }
  const rows=CLEANERS.map((c,i)=>`<tr class="clickable" data-c="${i}">
    <td>${bdg(c.brand)}${esc(c.name)}</td><td>${esc(c.prop)}</td>
    <td class="num">${c.cleans}</td>
    <td class="cell" style="${ratCol(c.clScore)}">${c.clScore==null?'—':c.clScore.toFixed(2)}</td>
    <td class="num">${c.clN||'—'}</td>
    <td class="cell" style="${npsCol(c.nps)}">${c.nps==null?'—':c.nps}</td>
    <td class="num">${c.npsN||'—'}</td></tr>`).join('');
  $('#p-clean').innerHTML=`<div class="box"><h3>Cleaner scorecard — last 90 days</h3>
    <table><thead><tr><th>Cleaner</th><th>Property</th><th class="num">Cleans</th>
    <th style="text-align:center">Cleanliness</th><th class="num">n</th>
    <th style="text-align:center">Guest NPS</th><th class="num">n</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="note">Cleanliness = combined ABB / BOK / IBE cleanliness score. Guest NPS joins the cleaner assignment to the departing reservation's checkout feedback (min 5 responses, YTD). Click a row for detail.</div></div>`;
  document.querySelectorAll('#p-clean tr[data-c]').forEach(tr=>tr.onclick=()=>openCleaner(+tr.dataset.c));
}
async function openCleaner(i){
  const c=CLEANERS[i]; const el=$('#panelDetail');
  el.innerHTML=`<button class="close" onclick="document.getElementById('panelDetail').classList.remove('on')">&times;</button>
    <h3>${esc(c.name)}</h3><div class="sub">${bdg(c.brand)}${esc(c.prop)} · ${esc(c.role||'cleaner')}</div>
    <div style="margin-top:16px">
      <div class="kv"><span>Cleans (90d)</span><span>${c.cleans}</span></div>
      <div class="kv"><span>Cleanliness score</span><span>${c.clScore==null?'—':c.clScore.toFixed(2)} <span style="color:var(--mut)">(n=${c.clN||0})</span></span></div>
      <div class="kv"><span>Guest NPS</span><span>${c.nps==null?'—':c.nps} <span style="color:var(--mut)">(n=${c.npsN||0})</span></span></div>
      <div class="kv"><span>Avg guest rating</span><span>${c.avgRating==null?'—':c.avgRating}</span></div>
      <div class="kv"><span>Promoters / detractors</span><span>${c.promoters==null?'—':c.promoters+' / '+c.detractors}</span></div>
      <div class="kv"><span>Email</span><span style="font-size:12px">${esc(c.email)}</span></div>
    </div><div class="ai" id="aiBox">Generating summary…</div>`;
  el.classList.add('on');
  try{
    const peers=CLEANERS.filter(x=>x.prop===c.prop);
    const r=await window.cowork.askClaude(
      "You are an ops analyst at Numa. In 3 short sentences, assess this cleaner's performance versus their property peers. Be specific and numeric. No preamble.",
      [{cleaner:c, peersAtProperty:peers}]);
    $('#aiBox').textContent = (typeof r==='string')?r:(r&&r.text)||JSON.stringify(r);
  }catch(e){ $('#aiBox').textContent='Summary unavailable ('+e.message+').'; }
}

/* ---------- OTA ---------- */
function renderOta(){
  if(!OTA_PROPS.length){ $('#p-ota').innerHTML='<div class="empty">No OTA data.</div>'; return; }
  const h=OTA_MONTHS.map(m=>`<th style="text-align:center">${m.slice(2)}</th>`).join('');
  const mk=key=>OTA_PROPS.map(p=>{
    const cells=OTA_MONTHS.map(m=>{const v=(OTA_DATA[p]||{})[m];const x=v?v[key]:null;
      return `<td class="cell" style="${ratCol(x)}">${x==null?'—':x.toFixed(2)}</td>`;}).join('');
    const b=(p==='Lisbon Anjos'||p==='Lisbon Rato')?'N':'L';
    return `<tr><td>${bdg(b)}${esc(p)}</td>${cells}</tr>`;}).join('');
  $('#p-ota').innerHTML=`<div class="box"><h3>Cleanliness rating — monthly</h3>
    <table><thead><tr><th>Property</th>${h}</tr></thead><tbody>${mk('cl')}</tbody></table></div>
    <div class="box"><h3>Overall rating — monthly</h3>
    <table><thead><tr><th>Property</th>${h}</tr></thead><tbody>${mk('ov')}</tbody></table>
    <div class="note">Combined reviews (Airbnb, Booking.com, IBE). Excludes cancelled reservations. By review-created month.</div></div>`;
}

/* ---------- Inspections ---------- */
function renderInsp(){
  const props=Object.keys(INSP_DATA).sort();
  if(!props.length){ $('#p-insp').innerHTML='<div class="empty">No inspection data.</div>'; return; }
  const h=INSP_MONTHS.map(m=>`<th style="text-align:center">${m.slice(2)}</th>`).join('');
  const rows=props.map(p=>{
    const cells=INSP_MONTHS.map(m=>{const v=(INSP_DATA[p]||{})[m];
      return `<td class="cell">${v?v.ins:'—'}</td>`;}).join('');
    const b=(p==='Lisbon Anjos'||p==='Lisbon Rato')?'N':'L';
    return `<tr><td>${bdg(b)}${esc(p)}</td>${cells}</tr>`;}).join('');
  $('#p-insp').innerHTML=`<div class="box"><h3>SHINE — units sent to inspection</h3>
    <table><thead><tr><th>Property</th>${h}</tr></thead><tbody>${rows}</tbody></table>
    <div class="note">Count of units moved to FOR_INSPECTION per cleaned month, last 3 months. "End cleaning" (direct-to-clean) counts are 0 across Lisbon — the market routes everything through inspection.</div></div>`;
}

/* ---------- Checklist ---------- */
function renderChk(){
  const m=CHECKLIST_META;
  const cards=`<div class="cards">
    <div class="card"><div class="k">Inspections logged</div><div class="v">${m.anjosRows}</div><div class="n">Anjos ${m.byProp.Anjos||0} · Rato ${m.byProp.Rato||0}</div></div>
    <div class="card"><div class="k">HSK callbacks</div><div class="v">${m.anjosCallbacks}</div><div class="n">${Math.round(m.anjosCallbacks/m.anjosRows*100)}% of inspections</div></div>
    <div class="card"><div class="k">Callback split</div><div class="v" style="font-size:18px">A ${m.cbByProp.Anjos||0} · R ${m.cbByProp.Rato||0}</div><div class="n">Anjos · Rato</div></div>
    <div class="card"><div class="k">Last response</div><div class="v" style="font-size:18px">${m.anjosLast}</div><div class="n">form still active</div></div>
  </div>`;
  const q=Q_FAILS.map(f=>`<tr><td title="${esc(f.full)}" style="white-space:normal">${esc(f.q)}</td><td class="num">${f.n}</td></tr>`).join('');
  const cb=INSP_CALLBACKS.map(c=>`<tr><td>${c.date}</td><td>${bdg('N')}${esc(c.prop)}</td><td>${esc(c.room)}</td><td>${esc(c.hsk||'—')}</td></tr>`).join('');
  $('#p-chk').innerHTML=cards+
    `<div class="box"><h3>Most-failed checklist items</h3>
     <table><thead><tr><th>Checkpoint</th><th class="num">Fails</th></tr></thead><tbody>${q}</tbody></table></div>
     <div class="box"><h3>Recent HSK callbacks</h3>
     <table><thead><tr><th>Date</th><th>Property</th><th>Room</th><th>Housekeeper</th></tr></thead><tbody>${cb}</tbody></table></div>
     <div class="warn">Checklist data carried forward from the last successful Google Sheets pull (${m.anjosLast}) — the Sheets connector was unavailable on this run. LSA checklist form (separate sheet) holds ${m.lsaRows} responses with ${m.lsaCallbacks} scoring ≤2 in any category — but the last submission is from May 2025. ${esc(m.lsaNote)}. LSA has no live room-inspection form.</div>`;
}

/* ---------- Unit NPS ---------- */
function renderUnit(){
  if(!UNIT_NPS.length){ $('#p-unit').innerHTML='<div class="empty">No unit NPS data.</div>'; return; }
  const worst=[...UNIT_NPS].sort((a,b)=>a.nps-b.nps).slice(0,40);
  const rows=worst.map(u=>`<tr><td>${esc(u.prop)}</td><td>${esc(u.unit)}</td>
    <td class="cell" style="${npsCol(u.nps)}">${u.nps}</td><td class="num">${u.n}</td>
    <td class="num" style="color:var(--mut)">${u.propNps==null?'—':u.propNps}</td>
    <td class="num" style="color:${u.propNps!=null&&u.nps<u.propNps?'var(--red)':'var(--grn)'}">${u.propNps==null?'—':(u.nps-u.propNps>0?'+':'')+(u.nps-u.propNps)}</td></tr>`).join('');
  const props={}; UNIT_NPS.forEach(u=>{(props[u.prop]=props[u.prop]||[]).push(u);});
  const summary=Object.keys(props).sort().map(p=>{
    const us=props[p], below=us.filter(u=>u.propNps!=null&&u.nps<u.propNps).length;
    return `<tr><td>${esc(p)}</td><td class="num">${us.length}</td>
      <td class="cell" style="${npsCol(PROP_AVGS[p])}">${PROP_AVGS[p]==null?'—':PROP_AVGS[p]}</td>
      <td class="num">${below}</td></tr>`;}).join('');
  $('#p-unit').innerHTML=`<div class="box"><h3>By property</h3>
    <table><thead><tr><th>Property</th><th class="num">Units rated</th><th style="text-align:center">Property NPS</th><th class="num">Units below</th></tr></thead><tbody>${summary}</tbody></table></div>
    <div class="box"><h3>Lowest-scoring units (bottom 40)</h3>
    <table><thead><tr><th>Property</th><th>Unit</th><th style="text-align:center">Unit NPS</th><th class="num">Responses</th><th class="num">Prop NPS</th><th class="num">Gap</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="note">Checkout feedback, last 90 days, min 3 responses per unit.</div></div>`;
}

/* ---------- Heatmap ---------- */
function renderHeat(){
  const h=WDS.map(w=>`<th style="text-align:center">${w}</th>`).join('');
  const mk=(src,isPct)=>DLY_PROPS.map(p=>{
    const cells=WD.map(w=>{const v=(src[p]||{})[w];
      const x=v==null?null:(isPct?v:v.pct);
      const ttl=(!isPct&&v)?`${v.d}/${v.t}`:'';
      return `<td class="cell" style="${heatCol(x)}" title="${ttl}">${x==null?'—':x+'%'}</td>`;}).join('');
    return `<tr><td>${bdg(DLY_BRAND[p])}${esc(DLY_DISPLAY[p])}</td>${cells}</tr>`;}).join('');
  $('#p-heat').innerHTML=`<div class="box"><h3>Last week — ${WEEK_START} to ${WEEK_END}</h3>
    <table><thead><tr><th>Property</th>${h}</tr></thead><tbody>${mk(WEEK_DATA,false)}</tbody></table>
    <div class="note">Hover a cell for delayed / total cleans.</div></div>
    <div class="box"><h3>4-week rolling average</h3>
    <table><thead><tr><th>Property</th>${h}</tr></thead><tbody>${mk(ROLL4_DATA,true)}</tbody></table></div>`;
}

/* ---------- Trend ---------- */
function renderTrend(){
  const h=DLY_MONTHS.map(m=>`<th style="text-align:center">${m.slice(2)}</th>`).join('');
  const rows=DLY_PROPS.map(p=>{
    const cells=DLY_MONTHS.map(m=>{const v=(MTHLY_DATA[p]||{})[m];
      return `<td class="cell" style="${heatCol(v)}">${v==null?'—':v+'%'}</td>`;}).join('');
    return `<tr><td>${bdg(DLY_BRAND[p])}${esc(DLY_DISPLAY[p])}</td>${cells}</tr>`;}).join('');
  const tot=DLY_MONTHS.map(m=>{
    const vs=DLY_PROPS.map(p=>(MTHLY_DATA[p]||{})[m]).filter(v=>v!=null);
    return `<td class="cell" style="${heatCol(vs.length?Math.round(vs.reduce((a,b)=>a+b,0)/vs.length):null)};font-weight:700">${vs.length?Math.round(vs.reduce((a,b)=>a+b,0)/vs.length)+'%':'—'}</td>`;}).join('');
  $('#p-trend').innerHTML=`<div class="box"><h3>Monthly delay rate — ${DLY_MONTHS[0]} to ${DLY_MONTHS[DLY_MONTHS.length-1]}</h3>
    <table><thead><tr><th>Property</th>${h}</tr></thead><tbody>${rows}
    <tr style="border-top:2px solid var(--line)"><td style="font-weight:700">Portfolio (unweighted)</td>${tot}</tr></tbody></table>
    <div class="note">Current month is partial (through ${GENERATED}).</div></div>`;
}

const R={sum:renderSum,clean:renderClean,ota:renderOta,insp:renderInsp,chk:renderChk,unit:renderUnit,heat:renderHeat,trend:renderTrend};
const done={};
function show(k){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.p===k));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+k));
  if(!done[k]){ R[k](); done[k]=1; }
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>show(t.dataset.p));
show('sum');
$('#refreshBtn').onclick=async e=>{
  const b=e.target; b.disabled=true; b.textContent='Refreshing…';
  try{ await window.cowork.runScheduledTask('cleaning-quality-dashboard-monday-refresh');
       b.textContent='Refresh queued'; }
  catch(err){ b.textContent='Refresh failed'; b.disabled=false; }
};

</script>
</body></html>
