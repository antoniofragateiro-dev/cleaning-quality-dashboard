*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:24px 20px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:13px}
button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:500}
.btn:hover{opacity:.85}.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{background:none;border:0;padding:10px 14px;font-size:13px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.panel{display:none}.panel.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:6px}
.card .v{font-size:26px;font-weight:600;letter-spacing:-.02em}
.card .n{font-size:12px;color:var(--mut);margin-top:2px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;overflow-x:auto}
.box h3{margin:0 0 12px;font-size:14px;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid #f2f0eb;white-space:nowrap}
tr:hover td{background:#fbfaf8}
.num{text-align:right;font-variant-numeric:tabular-nums}
.cell{text-align:center;font-variant-numeric:tabular-nums;border-radius:4px;font-weight:500}
.badge{display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;border-radius:4px;font-size:10px;font-weight:700;margin-right:6px}
.bN{background:var(--tealbg);color:var(--teal)}.bL{background:var(--orgbg);color:var(--org)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.note{font-size:12px;color:var(--mut);margin-top:10px}
.empty{color:var(--mut);font-size:13px;padding:20px;text-align:center}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mut);margin-top:10px;flex-wrap:wrap;align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.clickable{cursor:pointer}.clickable:hover{background:#f4f2ed !important}
#panelDetail{position:fixed;top:0;right:0;width:min(440px,92vw);height:100%;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 28px rgba(0,0,0,.10);padding:22px;overflow-y:auto;transform:translateX(100%);transition:transform .2s;z-index:50}
#panelDetail.on{transform:none}
#panelDetail h3{margin:0 0 4px;font-size:17px}
.close{position:absolute;top:14px;right:16px;background:none;border:0;font-size:22px;color:var(--mut);line-height:1}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f2f0eb;font-size:13px}
.kv span:first-child{color:var(--mut)}
.ai{background:#f6f5f2;border-radius:8px;padding:12px;font-size:13px;line-height:1.55;margin-top:14px;white-space:pre-wrap}
.warn{background:var(--ambbg);color:var(--amb);border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:14px}
.bar{height:6px;background:#eee;border-radius:99px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ink)}
.chart-box{position:relative;height:300px;margin-bottom:16px}

// ===== HELPERS =====
function badge(p){const b=DLY_BRAND[p];return b==='numa'?'<span class="badge bN">N</span>':'<span class="badge bL">L</span>';}
function dlyColor(v){if(v==null)return'background:#f3f3f1;color:#aaa';if(v>=30)return'background:var(--redbg);color:var(--red)';if(v>=10)return'background:var(--ambbg);color:var(--amb)';return'background:var(--grnbg);color:var(--grn)';}
function fmt(v){return v==null?'--':v.toFixed(1)+'%';}

// ===== TABS =====
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{

// ===== REFRESH =====
document.getElementById('refreshBtn').addEventListener('click',()=>{

    window.cowork.runScheduledTask('cleaning-quality-dashboard-monday-refresh').then(()=>{b.textContent='Sent';setTimeout(()=>{b.textContent='Refresh data';b.disabled=false;},2000);}).catch(()=>{b.textContent='Error';setTimeout(()=>{b.textContent='Refresh data';b.disabled=false;},2000);});

// ===== DETAIL PANEL =====
const pd=document.getElementById('panelDetail'),pdBody=document.getElementById('pdBody');
function openDetail(prop){
  document.getElementById('pdTitle').innerHTML=badge(prop)+prop;
  let h='';
  const wd=WEEK_DATA[prop]||{};
  const brand=DLY_BRAND[prop]||'?';
  const city=DLY_CITIES[prop]||'?';
  h+='<div class="kv"><span>Brand</span><span>'+brand+'</span></div>';
  h+='<div class="kv"><span>City</span><span>'+city+'</span></div>';
  const pt=Object.values(wd).reduce((a,v)=>a+v.t,0);
  const pd_=Object.values(wd).reduce((a,v)=>a+v.d,0);
  const pp=pt>0?(pd_/pt*100).toFixed(1)+'%':'--';
  h+='<div class="kv"><span>Week delay</span><span>'+pp+'</span></div>';
  h+='<div class="kv"><span>Cleaned units (week)</span><span>'+pt+'</span></div>';
  h+='<div class="kv"><span>Delayed units (week)</span><span>'+pd_+'</span></div>';
  const od=OTA_DATA[prop]||{};
  const lm=OTA_MONTHS.length?OTA_MONTHS[OTA_MONTHS.length-1]:null;
  if(lm&&od[lm]){
    h+='<div class="kv"><span>OTA overall ('+lm+')</span><span>'+fmtR(od[lm].overall)+'</span></div>';
    h+='<div class="kv"><span>OTA cleanliness ('+lm+')</span><span>'+fmtR(od[lm].clean)+'</span></div>';
    h+='<div class="kv"><span>Reviews ('+lm+')</span><span>'+od[lm].n+'</span></div>';
  }
  h+='<h4 style="margin:16px 0 8px;font-size:13px">Monthly HSK Delay (Active Res.)</h4>';
  const md=MTHLY_DATA[prop]||{};
  DLY_MONTHS.forEach(m=>{
    const v=md[m];
    const pct=v!=null?v.toFixed(1)+'%':'--';
    h+='<div class="kv"><span>'+m+'</span><span style="'+dlyColor(v)+'padding:1px 8px;border-radius:4px">'+pct+'</span></div>';
  });
  const units=UNIT_NPS_DATA[prop]||[];
  if(units.length){
    h+='<h4 style="margin:16px 0 8px;font-size:13px">Unit NPS (90d)</h4>';
    h+='<table><tr><th>Unit</th><th class="num">NPS</th><th class="num">N</th></tr>';
    units.forEach(u=>{
      const c=u.overall<30?'var(--red)':u.overall<50?'var(--amb)':'var(--grn)';
      h+='<tr><td>'+u.unit+'</td><td class="num" style="color:'+c+'">'+u.overall.toFixed(0)+'</td><td class="num">'+u.n+'</td></tr>';
    });
    h+='</table>';
  }
  pdBody.innerHTML=h;
  pd.classList.add('on');
}

// ===== SUMMARY TAB =====
(function(){
  const el=document.getElementById('p-sum');
  // KPI cards
  const totalCleaned=DLY_PROPS.reduce((a,p)=>{const w=WEEK_DATA[p]||{};return a+Object.values(w).reduce((s,v)=>s+v.t,0);},0);
  const totalDelayed=DLY_PROPS.reduce((a,p)=>{const w=WEEK_DATA[p]||{};return a+Object.values(w).reduce((s,v)=>s+v.d,0);},0);
  const avgDelay=totalCleaned>0?(totalDelayed/totalCleaned*100).toFixed(1):'0.0';
  const highDelay=DLY_PROPS.filter(p=>{const v=PROP_WEEK_DELAY[p];return v>=30;}).length;
  const numaD=DLY_PROPS.filter(p=>DLY_BRAND[p]==='numa').reduce((a,p)=>{const w=WEEK_DATA[p]||{};const t=Object.values(w).reduce((s,v)=>s+v.t,0);const d=Object.values(w).reduce((s,v)=>s+v.d,0);return{t:a.t+t,d:a.d+d};},{t:0,d:0});
  const lsaD=DLY_PROPS.filter(p=>DLY_BRAND[p]==='lsa').reduce((a,p)=>{const w=WEEK_DATA[p]||{};const t=Object.values(w).reduce((s,v)=>s+v.t,0);const d=Object.values(w).reduce((s,v)=>s+v.d,0);return{t:a.t+t,d:a.d+d};},{t:0,d:0});
  const numaAvg=numaD.t>0?(numaD.d/numaD.t*100).toFixed(1):'0.0';
  const lsaAvg=lsaD.t>0?(lsaD.d/lsaD.t*100).toFixed(1):'0.0';

  let h='<div class="cards">';
  h+='<div class="card"><div class="k">Avg HSK delay (active res.)</div><div class="v">'+avgDelay+'%</div><div class="n">'+totalDelayed+' / '+totalCleaned+' units this week</div></div>';
  h+='<div class="card"><div class="k">Numa delay</div><div class="v" style="color:var(--teal)">'+numaAvg+'%</div><div class="n">Anjos + Rato</div></div>';
  h+='<div class="card"><div class="k">LSA delay</div><div class="v" style="color:var(--org)">'+lsaAvg+'%</div><div class="n">'+DLY_PROPS.filter(p=>DLY_BRAND[p]==='lsa').length+' properties</div></div>';
  h+='<div class="card"><div class="k">Properties ≥30%</div><div class="v'+(highDelay>0?'" style="color:var(--red)':'')+'">'+highDelay+'</div><div class="n">of '+DLY_PROPS.length+' total</div></div>';
  h+='</div>';

  // Portfolio table
  h+='<div class="box"><h3>Portfolio — week '+WEEK_START+' to '+WEEK_END+'</h3>';
  h+='<table><tr><th>Property</th><th class="num">Cleaned</th><th class="num">Delayed</th><th class="num">Delay %</th><th class="num">4wk avg</th><th class="num">Trend</th></tr>';
  const sorted=[...DLY_PROPS].sort((a,b)=>(PROP_WEEK_DELAY[b]||0)-(PROP_WEEK_DELAY[a]||0));
  sorted.forEach(p=>{
    const wd=WEEK_DATA[p]||{};
    const t=Object.values(wd).reduce((s,v)=>s+v.t,0);
    const d=Object.values(wd).reduce((s,v)=>s+v.d,0);
    const pct=t>0?d/t*100:0;
    const r4=ROLL4_DATA[p]||{};
    const r4vals=Object.values(r4);
    const r4avg=r4vals.length>0?r4vals.reduce((a,v)=>a+v,0)/r4vals.length:0;
    const md=MTHLY_DATA[p]||{};
    const mvals=DLY_MONTHS.filter(m=>md[m]!=null).map(m=>md[m]);
    const last2=mvals.slice(-2);
    const trend=last2.length===2?last2[1]-last2[0]:0;
    const tArrow=trend>2?'\u2191':trend<-2?'\u2193':'\u2192';
    const tColor=trend>2?'var(--red)':trend<-2?'var(--grn)':'var(--mut)';
    h+='<tr class="clickable" onclick="openDetail(''+p.replace(/'/g,"\\'")+'')">';
    h+='<td>'+badge(p)+p+'</td>';
    h+='<td class="num">'+t+'</td>';
    h+='<td class="num">'+d+'</td>';
    h+='<td class="cell" style="'+dlyColor(pct)+'">'+pct.toFixed(1)+'%</td>';
    h+='<td class="num">'+r4avg.toFixed(1)+'%</td>';
    h+='<td class="num" style="color:'+tColor+'">'+tArrow+' '+(trend>=0?'+':'')+trend.toFixed(1)+'pp</td>';
    h+='</tr>';
  });
  h+='</table>';
  h+='<div class="legend"><span><span class="sw" style="background:var(--grnbg);border:1px solid var(--grn)"></span>&lt;10%</span><span><span class="sw" style="background:var(--ambbg);border:1px solid var(--amb)"></span>10-29%</span><span><span class="sw" style="background:var(--redbg);border:1px solid var(--red)"></span>≥30%</span></div>';
  h+='<div class="note">HSK Delay (Active Res.) = % of cleaned units where SHINE flagged an HSK delay with an active guest reservation. Source: Looker dashboard 431.</div>';
  h+='</div>';
  el.innerHTML=h;
})();

    units.forEach(u=>{
      const c=u.overall<30?'var(--red)':u.overall<50?'var(--amb)':'var(--grn)';
      const w=Math.max(0,Math.min(100,(u.overall+100)/2));
      h+='<tr><td>'+u.unit+'</td><td class="num" style="color:'+c+'">'+u.overall.toFixed(0)+'</td><td class="num">'+u.n+'</td>';
      h+='<td><div class="bar"><i style="width:'+w+'%;background:'+c+'"></i></div></td></tr>';
    });
    h+='</table></div>';
  });
  el.innerHTML=h;
})();

// ===== MONTHLY TREND TAB =====
(function(){
  const el=document.getElementById('p-trend');
  let h='<div class="box"><h3>Monthly HSK Delay (Active Res.) trend — 2026-01 to 2026-09</h3>';
  h+='<table><tr><th>Property</th>';
  DLY_MONTHS.forEach(m=>h+='<th class="cell" style="font-size:10px">'+m.slice(5)+'</th>');
  h+='<th class="num">Avg</th></tr>';
  const sorted=[...DLY_PROPS].sort((a,b)=>{
    const ma=MTHLY_DATA[a]||{}, mb=MTHLY_DATA[b]||{};
    const la=DLY_MONTHS.filter(m=>ma[m]!=null).map(m=>ma[m]);
    const lb=DLY_MONTHS.filter(m=>mb[m]!=null).map(m=>mb[m]);
    const aa=la.length?la.reduce((s,v)=>s+v,0)/la.length:0;
    const ab=lb.length?lb.reduce((s,v)=>s+v,0)/lb.length:0;
    return ab-aa;
  });
  sorted.forEach(p=>{
    const md=MTHLY_DATA[p]||{};
    const vals=DLY_MONTHS.filter(m=>md[m]!=null).map(m=>md[m]);
    const avg=vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:0;
    h+='<tr class="clickable" onclick="openDetail(''+p.replace(/'/g,"\\'")+'')">';
    h+='<td>'+badge(p)+p+'</td>';
    DLY_MONTHS.forEach(m=>{
      const v=md[m];
      if(v==null){h+='<td class="cell" style="background:#f3f3f1;color:#aaa">--</td>';return;}
      h+='<td class="cell" style="'+dlyColor(v)+'">'+v.toFixed(0)+'%</td>';
    });
    h+='<td class="num">'+avg.toFixed(1)+'%</td>';
    h+='</tr>';
  });
  h+='</table>';
  h+='<div class="legend"><span><span class="sw" style="background:var(--grnbg);border:1px solid var(--grn)"></span>&lt;10%</span><span><span class="sw" style="background:var(--ambbg);border:1px solid var(--amb)"></span>10-29%</span><span><span class="sw" style="background:var(--redbg);border:1px solid var(--red)"></span>≥30%</span></div>';
  h+='</div>';

  // Chart
  h+='<div class="box"><h3>Numa vs LSA — monthly delay trend</h3><div class="chart-box"><canvas id="trendChart"></canvas></div></div>';
  el.innerHTML=h;

  // Build chart
  const numaMonthly={}, lsaMonthly={};
  DLY_MONTHS.forEach(m=>{numaMonthly[m]={t:0,d:0};lsaMonthly[m]={t:0,d:0};});
  DLY_PROPS.forEach(p=>{
    const md=MTHLY_DATA[p]||{};
    const isNuma=DLY_BRAND[p]==='numa';
    DLY_MONTHS.forEach(m=>{
      // We only have pct, not raw counts for monthly — estimate from pct
      // Actually MTHLY_DATA has pct. We need to approximate.
      // For the chart, just average the pcts
    });
  });
  // Simple approach: average pct across properties per brand per month
  const numaChartData=[], lsaChartData=[];
  DLY_MONTHS.forEach(m=>{
    let nVals=[],lVals=[];
    DLY_PROPS.forEach(p=>{
      const md=MTHLY_DATA[p]||{};
      if(md[m]==null)return;
      if(DLY_BRAND[p]==='numa')nVals.push(md[m]);
      else lVals.push(md[m]);
    });
    numaChartData.push(nVals.length?nVals.reduce((a,v)=>a+v,0)/nVals.length:null);
    lsaChartData.push(lVals.length?lVals.reduce((a,v)=>a+v,0)/lVals.length:null);
  });

  new Chart(document.getElementById('trendChart'),{
    type:'line',
    data:{
      labels:DLY_MONTHS.map(m=>m.slice(5)),
      datasets:[
        {label:'Numa',data:numaChartData,borderColor:'#0f766e',backgroundColor:'rgba(15,118,110,.1)',fill:true,tension:.3},
        {label:'LSA',data:lsaChartData,borderColor:'#c2410c',backgroundColor:'rgba(194,65,12,.1)',fill:true,tension:.3}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      scales:{y:{beginAtZero:true,title:{display:true,text:'HSK Delay (Active Res.) %'}}},
      plugins:{legend:{position:'top'}}
    }
  });
})();
