.sub{color:var(--mut);font-size:13px}

table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}

tr:hover td{background:#fbfaf8}
.num{text-align:right;font-variant-numeric:tabular-nums}
.cell{text-align:center;font-variant-numeric:tabular-nums;border-radius:4px;font-weight:500}
.badge{display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;border-radius:4px;font-size:10px;font-weight:700;margin-right:6px}
.bN{background:var(--tealbg);color:var(--teal)}.bL{background:var(--orgbg);color:var(--org)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.note{font-size:12px;color:var(--mut);margin-top:10px}
.empty{color:var(--mut);font-size:13px;padding:20px;text-align:center}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mut);margin-top:10px;flex-wrap:wrap;align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.clickable{cursor:pointer}.clickable:hover{background:#f4f2ed !important}
#panelDetail{position:fixed;top:0;right:0;width:min(440px,92vw);height:100%;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 28px rgba(0,0,0,.10);padding:22px;overflow-y:auto;transform:translateX(100%);transition:transform .2s;z-index:50}

.close{position:absolute;top:14px;right:16px;background:none;border:0;font-size:22px;color:var(--mut);line-height:1}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f2f0eb;font-size:13px}
.kv span:first-child{color:var(--mut)}
.ai{background:#f6f5f2;border-radius:8px;padding:12px;font-size:13px;line-height:1.55;margin-top:14px;white-space:pre-wrap}
.warn{background:var(--ambbg);color:var(--amb);border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:14px}
.bar{height:6px;background:#eee;border-radius:99px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ink)}
.chart-box{position:relative;height:300px;margin-bottom:16px}

// ===== HELPERS =====
function badge(p){const b=DLY_BRAND[p];return b==='numa'?'<span class="badge bN">N</span>':'<span class="badge bL">L</span>';}

// ===== TABS =====
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));

  b.textContent='Refreshing...';b.disabled=true;
  if(window.cowork&&window.cowork.runScheduledTask){

});

(function(){
  const el=document.getElementById('p-heat');

  h+='<div style="overflow-x:auto"><table><tr><th>Property</th>';
  DOWS.forEach(d=>h+='<th class="num">'+d.slice(0,3)+'</th>');

  const sorted=DLY_PROPS.slice().sort((a,b)=>(PROP_WEEK_DELAY[b]||0)-(PROP_WEEK_DELAY[a]||0));
  sorted.forEach(p=>{
    h+='<tr class="clickable" onclick="openDetail(\''+p.replace(/'/g,"\\'")+'\')" ><td>'+badge(p)+p+'</td>';
    let wt=0,wd_=0;
    DOWS.forEach(d=>{
      const v=WEEK_DATA[p]&&WEEK_DATA[p][d];
      if(v){
        wt+=v.t;wd_+=v.d;
        h+='<td class="cell" style="'+dlyColor(v.pct)+'" title="'+v.d+'/'+v.t+' cleaned">'+fmt(v.pct)+'</td>';
      } else h+='<td class="cell" style="color:#ccc">--</td>';
    });
    const wp=wt>0?(wd_/wt*100).toFixed(1):0;
    h+='<td class="cell" style="'+dlyColor(parseFloat(wp))+';font-weight:700">'+wp+'%</td>';
    h+='</tr>';
  });
  h+='</table></div>';
  h+='<div class="legend"><span><span class="sw" style="background:var(--grnbg)"></span>&lt;10%</span><span><span class="sw" style="background:var(--ambbg)"></span>10-29%</span><span><span class="sw" style="background:var(--redbg)"></span>&gt;=30%</span></div>';

  });

})();

  });
