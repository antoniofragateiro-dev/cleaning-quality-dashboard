<html lang="en">
<head>
<meta charset="UTF-8"><title>Cleaning Quality Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root{
  --teal:#0f766e; --teal-lt:#ccfbf1; --orange:#c2410c; --orange-lt:#ffedd5;
  --ink:#111827; --sub:#6b7280; --line:#e5e7eb; --bg:#f8fafc; --card:#ffffff;
  --green:#16a34a; --green-lt:#dcfce7; --amber:#d97706; --amber-lt:#fef3c7; --red:#dc2626; --red-lt:#fee2e2;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
header{background:var(--card);border-bottom:1px solid var(--line);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
header h1{margin:0;font-size:20px;}
header p{margin:2px 0 0;font-size:12.5px;color:var(--sub);}
.btn{background:var(--teal);color:#fff;border:none;padding:8px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-weight:600;}
.btn:hover{opacity:.9;}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
nav{display:flex;gap:2px;background:var(--card);border-bottom:1px solid var(--line);padding:0 24px;overflow-x:auto;}
nav button{border:none;background:transparent;padding:12px 14px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
nav button.active{color:var(--teal);border-bottom-color:var(--teal);}
main{padding:20px 24px;max-width:1400px;margin:0 auto;}
.tab{display:none;}
.tab.active{display:block;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
.card .lbl{font-size:11.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;font-weight:600;}
.card .val{font-size:26px;font-weight:700;margin-top:4px;}
.card .sub{font-size:11.5px;color:var(--sub);margin-top:2px;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px;}
.panel h2{margin:0 0 12px;font-size:15px;}
table{border-collapse:collapse;width:100%;font-size:12.5px;}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);}
th{cursor:pointer;color:var(--sub);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.03em;user-select:none;white-space:nowrap;}
th:hover{color:var(--ink);}
th.sorted::after{content:" \25BC";font-size:9px;}
tbody tr:hover{background:#f9fafb;cursor:default;}
tbody tr.clickable:hover{background:var(--teal-lt);cursor:pointer;}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:10.5px;font-weight:700;color:#fff;}
.badge.n{background:var(--teal);} .badge.l{background:var(--orange);}
.num{text-align:right;font-variant-numeric:tabular-nums;}
.pill{padding:2px 8px;border-radius:5px;font-weight:700;font-size:12px;}
.g{background:var(--green-lt);color:var(--green);} .a{background:var(--amber-lt);color:var(--amber);} .r{background:var(--red-lt);color:var(--red);}
.chart-wrap{position:relative;height:340px;}
.flex{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;}
.grow{flex:1;min-width:320px;}
select,input[type=text]{padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;}
.filters{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.filters label{font-size:12px;color:var(--sub);font-weight:600;}
.side{position:fixed;top:0;right:0;width:380px;max-width:92vw;height:100vh;background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .25s ease;z-index:50;overflow-y:auto;padding:20px;}
.side.open{transform:translateX(0);}
.side h3{margin:0 0 4px;}
.side .close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--sub);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;z-index:40;}
.overlay.open{display:block;}
.ai-box{background:#f0fdfa;border:1px solid #99f6e4;border-radius:8px;padding:12px;margin-top:14px;font-size:13px;line-height:1.5;white-space:pre-wrap;}
.stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;}
.heat-cell{text-align:center;font-weight:700;border-radius:4px;}
.small{font-size:11px;color:var(--sub);}
.list-item{padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;display:flex;justify-content:space-between;}
</style>
</head>

function fmt1(x){ return (x===undefined||x===null||isNaN(x))?'—':(Math.round(x*10)/10).toFixed(1); }
function pct(x){ return (x===undefined||x===null||isNaN(x))?'—':(Math.round(x*10)/10)+'%'; }
function delayClass(p){ if(p>=30) return 'r'; if(p>=10) return 'a'; return 'g'; }

const TABS = [
  {id:'summary', label:'Summary'},
  {id:'cleaners', label:'Cleaners'},
  {id:'ota', label:'OTA ratings'},
  {id:'shine', label:'SHINE inspections'},
  {id:'checklist', label:'Checklist callbacks'},
  {id:'unitnps', label:'Unit NPS'},
  {id:'weekly', label:'Weekly HSK delay'},
  {id:'monthly', label:'Monthly HSK delay'}
];
let activeTab = 'summary';
const charts = {};

function renderNav(){
  const nav = document.getElementById('tabnav');
  nav.innerHTML = TABS.map(t=>`<button data-tab="${t.id}" class="${t.id===activeTab?'active':''}">${t.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
}
function switchTab(id){
  activeTab = id;
  renderNav();
  document.getElementById('main').innerHTML = renderers[id]();
  attachSort();
  setTimeout(()=>{ if(afterRender[id]) afterRender[id](); }, 0);
}

/* ---------- sortable tables ---------- */
function attachSort(){
  document.querySelectorAll('table[data-sortable]').forEach(tbl=>{
    tbl.querySelectorAll('th[data-key]').forEach(th=>{
      th.addEventListener('click', ()=>sortTable(tbl, th));
    });
  });
}
function sortTable(tbl, th){
  const type = th.dataset.type || 'num';
  const tbody = tbl.querySelector('tbody');
  const rows = Array.from(tbody.querySelectorAll('tr'));
  const idx = Array.from(th.parentNode.children).indexOf(th);
  const asc = th.dataset.asc !== 'true';
  th.parentNode.querySelectorAll('th').forEach(h=>{h.dataset.asc='';h.classList.remove('sorted');});
  th.dataset.asc = asc; th.classList.add('sorted');
  rows.sort((a,b)=>{
    let av = a.children[idx].dataset.v ?? a.children[idx].textContent.trim();
    let bv = b.children[idx].dataset.v ?? b.children[idx].textContent.trim();
    if(type==='num'){ av=parseFloat(av)||-Infinity; bv=parseFloat(bv)||-Infinity; return asc? av-bv : bv-av; }
    return asc? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
  });
  rows.forEach(r=>tbody.appendChild(r));
}

/* ================= SUMMARY ================= */
function renderSummary(){
  const props = DATA.DLY_PROPS;
  let totalUnits = 0, totalDelayed = 0;
  Object.values(DATA.PORTFOLIO).forEach(p=>{ totalUnits+=p.total; totalDelayed+=p.delayed; });
  const overallPct = totalUnits? (100*totalDelayed/totalUnits) : 0;
  const npsVals = Object.values(DATA.PROP_AVGS);
  const avgNps = npsVals.length? (npsVals.reduce((a,b)=>a+b,0)/npsVals.length) : 0;
  const otaLatestMonth = DATA.OTA_MONTHS[DATA.OTA_MONTHS.length-1];
  let otaSum=0, otaCnt=0;
  Object.values(DATA.OTA_DATA).forEach(m=>{ if(m[otaLatestMonth]){ otaSum+=m[otaLatestMonth].overall; otaCnt++; } });
  const avgOta = otaCnt? otaSum/otaCnt : 0;
  const callbacks = DATA.INSP_CALLBACKS.length;

  const rows = props.map(p=>{
    const perf = DATA.PORTFOLIO[p.name] || {total:0,delayed:0,pct:0};
    const nps = DATA.PROP_AVGS[p.name];
    let ota = null; const om = DATA.OTA_DATA[p.name];
    if(om && om[otaLatestMonth]) ota = om[otaLatestMonth].overall;
    return {name:p.name, brand:p.brand, total:perf.total, delayed:perf.delayed, pct:perf.pct, nps:nps, ota:ota};
  });
  rows.sort((a,b)=>b.pct-a.pct);

  return `
  <div class="cards">
    <div class="card"><div class="lbl">Portfolio delay rate</div><div class="val">${pct(overallPct)}</div><div class="sub">${totalDelayed.toLocaleString()} of ${totalUnits.toLocaleString()} cleans</div></div>
    <div class="card"><div class="lbl">Avg unit NPS</div><div class="val">${Math.round(avgNps)}</div><div class="sub">across ${npsVals.length} properties</div></div>
    <div class="card"><div class="lbl">Avg OTA overall (${otaLatestMonth})</div><div class="val">${fmt1(avgOta)}</div><div class="sub">across ${otaCnt} properties</div></div>
    <div class="card"><div class="lbl">Checklist callbacks</div><div class="val">${callbacks}</div><div class="sub">logged incidents</div></div>
    <div class="card"><div class="lbl">Properties tracked</div><div class="val">${props.length}</div><div class="sub">Numa + LSA, Lisbon</div></div>
  </div>
  <div class="panel">
    <h2>Portfolio overview</h2>
    <table data-sortable>
      <thead><tr>
        <th data-key="name" data-type="str">Property</th>
        <th data-key="brand" data-type="str">Brand</th>
        <th data-key="total" class="num">Cleans</th>
        <th data-key="delayed" class="num">Delayed</th>
        <th data-key="pct" class="num sorted" data-asc="false">Delay %</th>
        <th data-key="nps" class="num">Unit NPS</th>
        <th data-key="ota" class="num">OTA overall</th>
      </tr></thead>
      <tbody>
        ${rows.map(r=>`<tr>
          <td data-v="${stripName(r.name)}">${stripName(r.name)}</td>
          <td data-v="${r.brand}">${badge(r.brand)}</td>
          <td class="num" data-v="${r.total}">${r.total.toLocaleString()}</td>
          <td class="num" data-v="${r.delayed}">${r.delayed.toLocaleString()}</td>
          <td class="num" data-v="${r.pct}"><span class="pill ${delayClass(r.pct)}">${pct(r.pct)}</span></td>
          <td class="num" data-v="${r.nps ?? -999}">${r.nps ?? '—'}</td>
          <td class="num" data-v="${r.ota ?? -1}">${r.ota!=null?fmt1(r.ota):'—'}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

function cleanersRowsSorted(){ return DATA.CLEANERS.slice().sort((a,b)=>b.nps-a.nps); }
function afterCleaners(){
  document.querySelectorAll('#cleanTbl tbody tr').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      const rows = cleanersRowsSorted();
      const idx = parseInt(tr.dataset.idx);
      const c = rows[idx];
      openCleanerDetail(c);
    });
  });
}
function openCleanerDetail(c){
  const html = `
    <h3>${c.name}</h3>
    <div class="small">${stripName(c.property)}</div>
    <div class="stat-row"><span>Reviews</span><b>${c.n}</b></div>
    <div class="stat-row"><span>Avg rating</span><b>${fmt1(c.avg_rating)}</b></div>
    <div class="stat-row"><span>Promoters</span><b>${c.promoters}</b></div>
    <div class="stat-row"><span>Detractors</span><b>${c.detractors}</b></div>
    <div class="stat-row"><span>NPS</span><b>${c.nps}</b></div>
    ${c.cleans!=null?`<div class="stat-row"><span>Cleans (90d)</span><b>${c.cleans}</b></div>`:''}
    ${c.clean_score!=null?`<div class="stat-row"><span>Cleanliness score</span><b>${fmt1(c.clean_score)}</b></div>`:''}
    <div style="margin-top:14px;">
      <button class="btn" id="aiSummaryBtn">Generate AI summary</button>
      <div id="aiSummaryOut" class="ai-box" style="display:none;"></div>
    </div>`;
  document.getElementById('sideContent').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('side').classList.add('open');
  document.getElementById('aiSummaryBtn').addEventListener('click', ()=>{
    const out = document.getElementById('aiSummaryOut');
    out.style.display = 'block';
    out.textContent = 'Requesting AI summary…';
    const prompt = `Summarize the cleaning quality performance for cleaner "${c.name}" at ${stripName(c.property)}: ${c.n} reviews, average rating ${fmt1(c.avg_rating)}, ${c.promoters} promoters, ${c.detractors} detractors, NPS ${c.nps}. Give a 3-sentence performance summary and one coaching recommendation.`;
    if(window.cowork && window.cowork.askClaude){
      window.cowork.askClaude(prompt).then(res=>{ out.textContent = res; }).catch(err=>{ out.textContent='Could not generate summary.'; });
    } else {
      out.textContent = 'AI summary unavailable outside Cowork runtime.';
    }
  });
}
function closeSide(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('side').classList.remove('open');
}

/* ================= OTA ================= */
function renderOta(){
  const latest = DATA.OTA_MONTHS[DATA.OTA_MONTHS.length-1];
  const rows = DATA.OTA_PROPS.map(p=>{
    const m = DATA.OTA_DATA[p] && DATA.OTA_DATA[p][latest];
    return {name:p, overall:m?m.overall:null, clean:m?m.clean:null, count:m?m.count:0};
  }).sort((a,b)=>(b.overall??-1)-(a.overall??-1));
  return `
  <div class="panel">
    <h2>Overall vs cleanliness score by month (portfolio average)</h2>
    <div class="chart-wrap"><canvas id="otaChart"></canvas></div>
  </div>
  <div class="panel">
    <h2>Latest month (${latest}) by property</h2>
    <table data-sortable>
      <thead><tr>
        <th data-key="name" data-type="str">Property</th>
        <th data-key="overall" class="num sorted" data-asc="false">Overall</th>
        <th data-key="clean" class="num">Cleanliness</th>
        <th data-key="count" class="num">Reviews</th>
      </tr></thead>
      <tbody>
        ${rows.map(r=>`<tr>
          <td data-v="${stripName(r.name)}">${stripName(r.name)}</td>
          <td class="num" data-v="${r.overall ?? -1}">${r.overall!=null?fmt1(r.overall):'—'}</td>
          <td class="num" data-v="${r.clean ?? -1}">${r.clean!=null?fmt1(r.clean):'—'}</td>
          <td class="num" data-v="${r.count}">${r.count}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}
function afterOta(){
  const months = DATA.OTA_MONTHS;
  const overall = months.map(m=>{
    let s=0,c=0; Object.values(DATA.OTA_DATA).forEach(pm=>{ if(pm[m]){s+=pm[m].overall;c++;} });
    return c? +(s/c).toFixed(2) : null;
  });
  const clean = months.map(m=>{
    let s=0,c=0; Object.values(DATA.OTA_DATA).forEach(pm=>{ if(pm[m]&&pm[m].clean!=null){s+=pm[m].clean;c++;} });
    return c? +(s/c).toFixed(2) : null;
  });
  const ctx = document.getElementById('otaChart');
  if(!ctx) return;
  if(charts.ota) charts.ota.destroy();
  charts.ota = new Chart(ctx, {
    type:'line',
    data:{labels:months, datasets:[
      {label:'Overall', data:overall, borderColor:'#0f766e', backgroundColor:'#0f766e', tension:.25},
      {label:'Cleanliness', data:clean, borderColor:'#c2410c', backgroundColor:'#c2410c', tension:.25}
    ]},
    options:{responsive:true, maintainAspectRatio:false, scales:{y:{min:7,max:10}}}
  });
}

/* ================= SHINE ================= */
function renderShine(){
  const months = DATA.INSP_MONTHS;
  const props = DATA.DLY_PROPS.map(p=>p.name);
  return `
  <div class="panel">
    <h2>SHINE inspection rate — units inspected vs cleaned</h2>
    <table data-sortable>
      <thead><tr>
        <th data-key="name" data-type="str">Property</th>
        ${months.map(m=>`<th data-key="${m}" class="num">${m}</th>`).join('')}
      </tr></thead>
      <tbody>
        ${props.map(p=>{
          const d = DATA.INSP_DATA[p] || {};
          return `<tr><td data-v="${stripName(p)}">${stripName(p)}</td>${months.map(m=>{
            const v = d[m];
            if(!v) return `<td class="num" data-v="-1">—</td>`;
            const rate = v.cleaned? +(100*v.inspected/v.cleaned).toFixed(1) : null;
            return `<td class="num" data-v="${v.inspected}">${v.inspected} / ${v.cleaned}${rate!=null?` <span class="small">(${rate}%)</span>`:''}</td>`;
          }).join('')}</tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

/* ================= CHECKLIST CALLBACKS ================= */
function renderChecklist(){
  const cb = DATA.INSP_CALLBACKS;
  const byProp = {};
  cb.forEach(c=>{ byProp[c.property] = (byProp[c.property]||0)+1; });
  const propRows = Object.entries(byProp).sort((a,b)=>b[1]-a[1]);
  const recent = cb.slice().sort((a,b)=> String(b.date).split('/').reverse().join('').localeCompare(String(a.date).split('/').reverse().join(''))).slice(0,25);
  return `
  <div class="cards">
    <div class="card"><div class="lbl">Total callbacks</div><div class="val">${cb.length}</div></div>
    <div class="card"><div class="lbl">Properties/sources affected</div><div class="val">${propRows.length}</div></div>
    <div class="card"><div class="lbl">Quality fails logged</div><div class="val">${DATA.Q_FAILS.length}</div></div>
  </div>
  <div class="flex">
    <div class="panel grow">
      <h2>Callback rate by property / source</h2>
      <table data-sortable>
        <thead><tr><th data-key="p" data-type="str">Property / source</th><th data-key="n" class="num sorted" data-asc="false">Callbacks</th></tr></thead>
        <tbody>${propRows.map(([p,n])=>`<tr><td data-v="${stripName(p)}">${stripName(p)}</td><td class="num" data-v="${n}">${n}</td></tr>`).join('')}</tbody>
      </table>
    </div>
    <div class="panel grow">
      <h2>Recent callbacks</h2>
      ${recent.map(c=>`<div class="list-item"><span>${stripName(c.property)}</span><span class="small">${c.date} · ${c.source}</span></div>`).join('')}
    </div>
  </div>`;
}

function afterUnitNps(){
  const body = document.getElementById('unitTblBody');
  body.innerHTML = renderUnitRows('');
  document.getElementById('unitPropFilter').addEventListener('change', e=>{
    body.innerHTML = renderUnitRows(e.target.value);
  });

/* ================= WEEKLY HEATMAP ================= */
function renderWeekly(){
  const days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const props = DATA.DLY_PROPS.map(p=>p.name);
  return `
  <div class="panel">
    <h2>Weekly HSK delay heatmap — % of cleans delayed by day of week</h2>
    <table data-sortable>
      <thead><tr>
        <th data-key="name" data-type="str">Property</th>
        ${days.map(d=>`<th data-key="${d}" class="num">${d.slice(0,3)}</th>`).join('')}
        <th data-key="r4" class="num">4wk avg</th>
      </tr></thead>
      <tbody>
        ${props.map(p=>{
          const wd = DATA.WEEK_DATA[p] || {};
          const r4 = DATA.ROLL4_DATA[p] || {};
          const r4vals = Object.values(r4);
          const r4avg = r4vals.length? Math.round(r4vals.reduce((a,b)=>a+b,0)/r4vals.length) : null;
          return `<tr><td data-v="${stripName(p)}">${stripName(p)}</td>${days.map(d=>{
            const v = wd[d];
            if(!v || !v.total) return `<td class="num" data-v="-1">—</td>`;
            const rate = +(100*v.delayed/v.total).toFixed(1);
            return `<td class="num" data-v="${rate}"><div class="heat-cell ${delayClass(rate)}" style="padding:4px 2px;">${rate}%</div></td>`;
          }).join('')}<td class="num" data-v="${r4avg ?? -1}">${r4avg!=null?r4avg+'%':'—'}</td></tr>`;
        }).join('')}
      </tbody>
    </table>
    <p class="small">Green &lt;10% · Amber 10–29% · Red ≥30% · "4wk avg" = mean daily delay rate over the trailing 4 weeks</p>
  </div>`;
}

/* ================= MONTHLY BAR CHART ================= */
function renderMonthly(){
  return `
  <div class="panel">
    <h2>Monthly HSK delay rate</h2>
    <div class="filters">
      <label>Brand</label>
      <select id="brandFilter">
        <option value="">All</option>
        <option value="N">Numa</option>
        <option value="L">LSA</option>
      </select>
    </div>
    <div class="chart-wrap"><canvas id="monthlyChart"></canvas></div>
  </div>`;
}
function monthlyChartData(brand){
  const months = DATA.DLY_MONTHS;
  const props = DATA.DLY_PROPS.filter(p=> !brand || p.brand===brand).map(p=>p.name);
  return months.map(m=>{
    let total=0, delayed=0;
    props.forEach(p=>{
      const md = DATA.MTHLY_DATA[p] && DATA.MTHLY_DATA[p][m];
      if(md){ total+=md.total; delayed+=md.delayed; }
    });
    return total? +(100*delayed/total).toFixed(1) : null;
  });
}
function afterMonthly(){
  const ctx = document.getElementById('monthlyChart');
  function draw(brand){
    const data = monthlyChartData(brand);
    if(charts.monthly) charts.monthly.destroy();
    charts.monthly = new Chart(ctx, {
      type:'bar',
      data:{labels:DATA.DLY_MONTHS, datasets:[{label:'Delay %', data:data, backgroundColor: data.map(v=> v==null?'#e5e7eb': v>=30?'#dc2626': v>=10?'#d97706':'#16a34a')}]},
      options:{responsive:true, maintainAspectRatio:false, scales:{y:{beginAtZero:true, ticks:{callback:v=>v+'%'}}}}
    });
  }
  draw('');
  document.getElementById('brandFilter').addEventListener('change', e=>draw(e.target.value));
}

const renderers = {
  summary: renderSummary, cleaners: renderCleaners, ota: renderOta, shine: renderShine,
  checklist: renderChecklist, unitnps: renderUnitNps, weekly: renderWeekly, monthly: renderMonthly
};
const afterRender = {
  cleaners: afterCleaners, ota: afterOta, unitnps: afterUnitNps, monthly: afterMonthly
};

renderNav();
document.getElementById('main').innerHTML = renderers[activeTab]();
attachSort();
</script>
