  const dl=(first!=null&&last!=null)?last-first:null;
  const c=dl==null?"var(--mut)":(dl>0?"var(--red)":dl<0?"var(--grn)":"var(--mut)");
  h+=`<td class="num" style="color:${c};font-weight:600">${dl==null?"—":(dl>0?"+":"")+dl+"pp"}</td></tr>`;});
 h+=`</tbody></table><div class="note">Trend compares the first and last month with data. ${CURRENT_MONTH} is partial.</div></div>`;
 return h;}
