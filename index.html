<script>
const D = JSON.parse(document.getElementById('cqd-data').textContent);
const {WEEK_DATA,ROLL4_DATA,MTHLY_DATA,DLY_PROPS,DLY_BRAND,DLY_MONTHS,OTA_DATA,OTA_MONTHS,OTA_PROPS,

const WD = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bdg = p => `<span class="badge b${DLY_BRAND[p]||'L'}">${DLY_BRAND[p]||'L'}</span>`;
const nz = v => (v===null||v===undefined||v==='') ? '—' : v;

// delay % → colour
function dcol(p){
  if(p===null||p===undefined) return '';
  if(p>=50) return 'background:var(--redbg);color:var(--red)';
  if(p>=30) return 'background:var(--ambbg);color:var(--amb)';
  if(p>=15) return 'background:#fffbeb;color:#78350f';
  return 'background:var(--grnbg);color:var(--grn)';
}
function npscol(n){
  if(n===null||n===undefined) return '';
  if(n>=50) return 'background:var(--grnbg);color:var(--grn)';
  if(n>=0)  return 'background:var(--ambbg);color:var(--amb)';
  return 'background:var(--redbg);color:var(--red)';
}
const H = (id,h) => document.getElementById(id).innerHTML = h;

/* ---------- Summary ---------- */
(function(){
  const rows = DLY_PROPS.map(p=>{
    const v = PORTFOLIO[p]||{total:0,delayed:0,pct:0};
    const avg = PROP_AVGS[p];
    return {p,...v,avg};
  }).sort((a,b)=>b.pct-a.pct);
  const worst = rows.slice(0,5);
  H('p-sum', `
  <div class="cards">
    <div class="card"><div class="k">Avg HSK delay last week</div><div class="v">${META.avg_delay}%</div>
      <div class="n">${META.tot_delayed} of ${META.tot_cleanings} cleanings with HSK delay (active res.)</div></div>
    <div class="card"><div class="k">Properties ≥ 30%</div><div class="v">${META.high_delay}</div>
      <div class="n">of ${META.n_props} Lisbon properties</div></div>
    <div class="card"><div class="k">Checklist callback rate</div><div class="v">${nz(META.chk_callback_rate)}${META.chk_callback_rate!=null?'%':''}</div>
      <div class="n">${nz(META.chk_callbacks_ar)} of ${META.chk_ar_rows} Anjos/Rato inspections</div></div>
    <div class="card"><div class="k">Cleaners tracked</div><div class="v">${META.n_cleaners}</div>
      <div class="n">${META.n_cleaner_nps} with guest-NPS match</div></div>
    <div class="card"><div class="k">Units with NPS</div><div class="v">${META.n_unit_nps}</div>
      <div class="n">min 3 responses, last 90 days</div></div>
  </div>
  <div class="box"><h3>Highest delay — last week</h3>

    ${worst.map(r=>`<tr><td>${bdg(r.p)}${esc(r.p)}</td><td class="num">${r.total}</td><td class="num">${r.delayed}</td>
      <td class="num"><span class="pill" style="${dcol(r.pct)}">${r.pct}%</span></td><td class="num">${nz(r.avg)}${r.avg!=null?'%':''}</td></tr>`).join('')}
    </tbody></table>
    <div class="note">An HSK delay counts when SHINE flags an HSK_DELAY event on a unit-day that has an active guest reservation. Source: Looker dashboard 431.</div>
  </div>
  <div class="box"><h3>All properties — last week</h3>
    <table><thead><tr><th>Property</th><th class="num">Cleanings</th><th class="num">HSK Delay</th><th class="num">Week %</th><th style="width:120px">&nbsp;</th><th class="num">YTD avg %</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${bdg(r.p)}${esc(r.p)}</td><td class="num">${r.total}</td><td class="num">${r.delayed}</td>
      <td class="num"><span class="pill" style="${dcol(r.pct)}">${r.pct}%</span></td>
      <td><div class="bar"><i style="width:${Math.min(100,r.pct)}%"></i></div></td>
      <td class="num">${nz(r.avg)}${r.avg!=null?'%':''}</td></tr>`).join('')}
    </tbody></table>
    <div class="legend"><span><span class="sw bN" style="background:var(--tealbg)"></span>N = Numa-operated</span>
      <span><span class="sw" style="background:var(--orgbg)"></span>L = LSA portfolio</span></div>
  </div>`);
})();

/* ---------- Cleaners ---------- */
(function(){
  if(!CLEANERS.length){ H('p-clean','<div class="box"><div class="empty">No cleaner data available.</div></div>'); return; }
  H('p-clean', `<div class="box"><h3>Cleaner scorecard — last 90 days (assignments) · YTD (guest NPS)</h3>
    <table><thead><tr><th>Cleaner</th><th>Properties</th><th class="num">Cleans</th><th class="num">Responses</th>
      <th class="num">Prom.</th><th class="num">Detr.</th><th class="num">NPS</th><th class="num">Cleanliness</th></tr></thead><tbody>
    ${CLEANERS.map((c,i)=>`<tr class="clickable" data-c="${i}"><td>${esc(c.name)}</td>
      <td style="white-space:normal;max-width:260px;font-size:12px;color:var(--mut)">${c.props.map(p=>esc(p)).join(', ')||'—'}</td>
      <td class="num">${c.cleans||'—'}</td><td class="num">${c.nps_n||'—'}</td>
      <td class="num">${c.promoters||0}</td><td class="num">${c.detractors||0}</td>
      <td class="num"><span class="pill" style="${npscol(c.nps)}">${nz(c.nps)}</span></td>
      <td class="num">${nz(c.score)}</td></tr>`).join('')}
    </tbody></table>
    <div class="note">NPS = (promoters ≥9 − detractors ≤6) ÷ responses, from checkout feedback joined to the cleaner assigned on the departure date. Minimum 5 responses. Click a row for detail.</div></div>`);
  document.querySelectorAll('#p-clean tr[data-c]').forEach(tr=>tr.onclick=()=>showCleaner(CLEANERS[+tr.dataset.c]));
})();

const pd = document.getElementById('panelDetail');
document.getElementById('pdClose').onclick = ()=>pd.classList.remove('on');
async function showCleaner(c){
  document.getElementById('pdBody').innerHTML = `<h3>${esc(c.name)}</h3>
    <div class="sub">${c.props.map(p=>esc(p)).join(', ')||'—'}</div>
    <div style="margin-top:16px">
      <div class="kv"><span>Cleans (90d)</span><b>${nz(c.cleans)}</b></div>
      <div class="kv"><span>Guest responses (YTD)</span><b>${nz(c.nps_n)}</b></div>
      <div class="kv"><span>Promoters</span><b>${c.promoters||0}</b></div>
      <div class="kv"><span>Detractors</span><b>${c.detractors||0}</b></div>
      <div class="kv"><span>NPS</span><b>${nz(c.nps)}</b></div>
      <div class="kv"><span>Cleanliness score</span><b>${nz(c.score)}</b></div>
    </div>
    <div class="ai" id="aiBox">Generating summary…</div>`;
  pd.classList.add('on');
  const box = document.getElementById('aiBox');
  try{
    if(window.cowork && window.cowork.askClaude){
      const r = await window.cowork.askClaude(
        'You are briefing a Lisbon housekeeping manager. In 2-3 short sentences, assess this cleaner\'s performance and name one concrete action. Be direct, no preamble.',
        [c]);
      box.textContent = (typeof r==='string') ? r : (r && (r.text||r.content||JSON.stringify(r)));
    } else { box.textContent = 'AI summary unavailable outside Cowork.'; }
  }catch(e){ box.textContent = 'AI summary failed: ' + e.message; }
}

/* ---------- OTA ---------- */
(function(){

   <table><thead><tr><th>Property</th>${mo.map(m=>`<th class="num">${m.slice(2)}</th>`).join('')}</tr></thead><tbody>
   ${OTA_PROPS.map(p=>`<tr><td>${bdg(p)}${esc(p)}</td>${mo.map(m=>{
      const c=(OTA_DATA[p]||{})[m];
      if(!c||c.cl==null) return '<td class="num" style="color:var(--mut)">—</td>';
      const col = c.cl>=9 ? 'var(--grn)' : c.cl>=8 ? 'var(--amb)' : 'var(--red)';
      return `<td class="num" style="color:${col}"><b>${c.cl.toFixed(1)}</b><span style="color:var(--mut);font-size:11px"> (${c.ov!=null?c.ov.toFixed(1):'—'})</span></td>`;
    }).join('')}</tr>`).join('')}
   </tbody></table>
   <div class="note">Guest review scores on a 1–10 scale, by review-created month, cancellations excluded.</div></div>`);
})();

/* ---------- SHINE inspections ---------- */
(function(){
  const props = Object.keys(INSP_DATA).sort((a,b)=>(DLY_BRAND[a]==='L')-(DLY_BRAND[b]==='L')||a.localeCompare(b));
  if(!props.length){ H('p-insp','<div class="box"><div class="empty">No SHINE inspection data.</div></div>'); return; }
  H('p-insp', `<div class="box"><h3>Inspection coverage — units sent to inspection vs cleanings completed</h3>
   <table><thead><tr><th>Property</th>${INSP_MONTHS.map(m=>`<th class="num">${m}</th>`).join('')}</tr></thead><tbody>
   ${props.map(p=>`<tr><td>${bdg(p)}${esc(p)}</td>${INSP_MONTHS.map(m=>{
      const c=(INSP_DATA[p]||{})[m];
      if(!c) return '<td class="num" style="color:var(--mut)">—</td>';
      const col = c.rate>=80?'var(--grn)':c.rate>=40?'var(--amb)':'var(--red)';
      return `<td class="num"><b style="color:${col}">${c.rate!=null?c.rate+'%':'—'}</b><span style="color:var(--mut);font-size:11px"> ${c.insp}/${c.end}</span></td>`;
    }).join('')}</tr>`).join('')}
   </tbody></table>
   <div class="note">Rate = units reaching FOR_INSPECTION ÷ units with a completed cleaning. Low rates mean cleanings are closed without an inspection step.</div></div>`);
})();

/* ---------- Checklist ---------- */
(function(){
  const ar = INSP_CALLBACKS.filter(c=>c.src==='Anjos/Rato');
  const lsa = INSP_CALLBACKS.filter(c=>c.src==='LSA');
  const stale = META.chk_lsa_last ? `LSA form last response ${esc(META.chk_lsa_last)} — historical, not refreshed.` : '';
  H('p-chk', `
  ${stale?`<div class="warn">${stale}</div>`:''}
  <div class="cards">
    <div class="card"><div class="k">Anjos/Rato responses</div><div class="v">${META.chk_ar_rows}</div><div class="n">latest ${esc(META.chk_ar_last||'—')}</div></div>
    <div class="card"><div class="k">HSK callbacks</div><div class="v">${ar.length}</div><div class="n">${nz(META.chk_callback_rate)}% of inspections</div></div>
    <div class="card"><div class="k">LSA low-score flags</div><div class="v">${lsa.length}</div><div class="n">of ${META.chk_lsa_rows} historical rows</div></div>
  </div>
  <div class="box"><h3>Failure rate by checklist question — Anjos &amp; Rato</h3>
   <table><thead><tr><th>Question</th><th class="num">Fails</th><th class="num">Asked</th><th class="num">Rate</th><th class="num">CL</th><th class="num">MNT</th><th class="num">Std</th></tr></thead><tbody>
   ${Q_FAILS.length?Q_FAILS.map(q=>`<tr><td style="white-space:normal;max-width:420px">${esc(q.q)}</td>
     <td class="num">${q.n}</td><td class="num">${q.asked}</td>
     <td class="num"><span class="pill" style="${dcol(q.rate)}">${q.rate}%</span></td>
     <td class="num">${q.cl||''}</td><td class="num">${q.mnt||''}</td><td class="num">${q.std||''}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">No failures recorded.</td></tr>'}
   </tbody></table>
   <div class="note">CL = cleaning issue · MNT = maintenance issue · Std = standards/stock issue, as tagged by the inspector.</div></div>
  <div class="box"><h3>Callbacks — housekeeping asked to return</h3>
   <table><thead><tr><th>Source</th><th>When</th><th>Property</th><th>Unit</th><th>Housekeeper</th><th>Outcome</th></tr></thead><tbody>
   ${INSP_CALLBACKS.length?INSP_CALLBACKS.slice().reverse().slice(0,120).map(c=>`<tr><td>${esc(c.src)}</td><td>${esc(c.ts)}</td>
     <td>${esc(c.prop)}</td><td>${esc(c.room)}</td><td>${esc(c.hsk)}</td><td style="white-space:normal">${esc(c.answer)}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">No callbacks.</td></tr>'}
   </tbody></table></div>`);
})();

/* ---------- Unit NPS ---------- */
(function(){
  if(!UNIT_NPS.length){ H('p-unit','<div class="box"><div class="empty">No unit NPS data.</div></div>'); return; }
  const worst = UNIT_NPS.slice(0,40);
  H('p-unit', `<div class="box"><h3>Lowest-scoring units — last 90 days (min 3 responses)</h3>
   <table><thead><tr><th>Unit</th><th>Property</th><th class="num">Responses</th><th class="num">Unit NPS</th><th class="num">Property NPS</th><th class="num">Delta</th></tr></thead><tbody>
   ${worst.map(u=>{
     const d = (u.prop_nps!=null) ? u.nps-u.prop_nps : null;
     return `<tr><td>${esc(u.unit)}</td><td>${bdg(u.prop)}${esc(u.prop)}</td><td class="num">${u.n}</td>
      <td class="num"><span class="pill" style="${npscol(u.nps)}">${u.nps}</span></td>
      <td class="num" style="color:var(--mut)">${nz(u.prop_nps)}</td>
      <td class="num" style="color:${d==null?'var(--mut)':d<0?'var(--red)':'var(--grn)'}">${d==null?'—':(d>0?'+':'')+d}</td></tr>`;
   }).join('')}
   </tbody></table>
   <div class="note">Showing the ${worst.length} lowest of ${UNIT_NPS.length} units with at least 3 checkout responses. Delta is unit vs its property average.</div></div>`);
})();

/* ---------- Weekly heatmap ---------- */
(function(){
  H('p-heat', `<div class="box"><h3>HSK Delay % by weekday — week of ${META.week_start}</h3>
   <table><thead><tr><th>Property</th>${WD.map(d=>`<th class="num">${d.slice(0,3)}</th>`).join('')}<th class="num">Week</th></tr></thead><tbody>
   ${DLY_PROPS.map(p=>{
     const w=WEEK_DATA[p]||{}; const tot=PORTFOLIO[p]||{pct:null};
     return `<tr><td>${bdg(p)}${esc(p)}</td>${WD.map(d=>{
        const c=w[d]; if(!c) return '<td class="cell" style="color:var(--mut)">—</td>';
        return `<td class="cell" style="${dcol(c.pct)}" title="${c.d} of ${c.t} HSK delayed">${c.pct}%</td>`;
      }).join('')}<td class="num"><b>${tot.pct!=null?tot.pct+'%':'—'}</b></td></tr>`;
   }).join('')}
   </tbody></table>
   <div class="legend"><span><span class="sw" style="background:var(--grnbg)"></span>&lt;15%</span>
    <span><span class="sw" style="background:#fffbeb"></span>15–29%</span>
    <span><span class="sw" style="background:var(--ambbg)"></span>30–49%</span>
    <span><span class="sw" style="background:var(--redbg)"></span>≥50%</span></div></div>
   <div class="box"><h3>4-week rolling average by weekday — from ${META.roll4_start}</h3>
   <table><thead><tr><th>Property</th>${WD.map(d=>`<th class="num">${d.slice(0,3)}</th>`).join('')}</tr></thead><tbody>
   ${DLY_PROPS.map(p=>{
     const w=ROLL4_DATA[p]||{};
     return `<tr><td>${bdg(p)}${esc(p)}</td>${WD.map(d=>{
        const v=w[d]; if(v==null) return '<td class="cell" style="color:var(--mut)">—</td>';
        return `<td class="cell" style="${dcol(v)}">${v}%</td>`;
      }).join('')}</tr>`;
   }).join('')}
   </tbody></table></div>`);
})();

/* ---------- Monthly trend ---------- */
(function(){
  H('p-trend', `<div class="box"><h3>HSK Delay % by month — ${DLY_MONTHS[0]} to ${DLY_MONTHS[DLY_MONTHS.length-1]}</h3>
   <table><thead><tr><th>Property</th>${DLY_MONTHS.map(m=>`<th class="num">${m.slice(2)}</th>`).join('')}<th class="num">Avg</th></tr></thead><tbody>
   ${DLY_PROPS.map(p=>{
     const m=MTHLY_DATA[p]||{};
     return `<tr><td>${bdg(p)}${esc(p)}</td>${DLY_MONTHS.map(k=>{
        const v=m[k]; if(v==null) return '<td class="cell" style="color:var(--mut)">—</td>';
        return `<td class="cell" style="${dcol(v)}">${v}%</td>`;
      }).join('')}<td class="num"><b>${nz(PROP_AVGS[p])}${PROP_AVGS[p]!=null?'%':''}</b></td></tr>`;
   }).join('')}
   </tbody></table>
   <div class="note">Portfolio-wide monthly HSK delay rate (active reservations), current year to date.</div></div>`);
})();

/* ---------- Tabs + refresh ---------- */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  document.getElementById('p-'+t.dataset.p).classList.add('on');
  try{ localStorage.setItem('cqd.tab', t.dataset.p); }catch(e){}
});
try{ const s=localStorage.getItem('cqd.tab');
  if(s && document.getElementById('p-'+s)){ document.querySelector(`.tab[data-p="${s}"]`).click(); }
}catch(e){}

document.getElementById('refreshBtn').onclick = async function(){
  this.disabled=true; const o=this.textContent; this.textContent='Refreshing…';
  try{
    await window.cowork.runScheduledTask('cleaning-quality-dashboard-monday-refresh');
    this.textContent='Refresh queued';
  }catch(e){ this.textContent='Refresh failed'; console.error(e); this.disabled=false; setTimeout(()=>{this.textContent=o;},2500); }
};
console.log('cqd loaded', META.n_props, 'props; avg HSK delay', META.avg_delay+'%');

</script>
</body></html>
