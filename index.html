td{padding:6px 8px;border-bottom:1px solid #f2f0eb;white-space:nowrap}
tr:hover td{background:#fbfaf8}
.num{text-align:right;font-variant-numeric:tabular-nums}
.cell{text-align:center;font-variant-numeric:tabular-nums;border-radius:4px;font-weight:500}
.badge{display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;border-radius:4px;font-size:10px;font-weight:700;margin-right:6px}
.bN{background:var(--tealbg);color:var(--teal)}.bL{background:var(--orgbg);color:var(--org)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.note{font-size:12px;color:var(--mut);margin-top:10px}
.empty{color:var(--mut);font-size:13px;padding:20px;text-align:center}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mut);margin-top:10px;flex-wrap:wrap;align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.clickable{cursor:pointer}.clickable:hover{background:#f4f2ed !important}

#panelDetail.on{transform:none}
#panelDetail h3{margin:0 0 4px;font-size:17px}
.close{position:absolute;top:14px;right:16px;background:none;border:0;font-size:22px;color:var(--mut);line-height:1}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f2f0eb;font-size:13px}
.kv span:first-child{color:var(--mut)}
.ai{background:#f6f5f2;border-radius:8px;padding:12px;font-size:13px;line-height:1.55;margin-top:14px;white-space:pre-wrap}
.warn{background:var(--ambbg);color:var(--amb);border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:14px}

function tCheck(){
 let h="";
 if(META.lsa_latest&&META.lsa_latest<"2026")h+=`<div class="warn">LSA checklist form is historical — last response ${esc(META.lsa_latest)}. Only the Anjos/Rato form is actively collecting.</div>`;
 h+=`<div class="cards">
 <div class="card"><div class="k">Anjos / Rato responses</div><div class="v">${META.ar_responses}</div><div class="n">latest ${esc(META.ar_latest||"—")}</div></div>
 <div class="card"><div class="k">LSA responses</div><div class="v">${META.lsa_responses}</div><div class="n">latest ${esc(META.lsa_latest||"—")}</div></div>
 <div class="card"><div class="k">Total callbacks</div><div class="v">${INSP_CALLBACKS.length}</div><div class="n">HSK had to return</div></div></div>`;
 if(Q_FAILS.length){
  h+=`<div class="box"><h3>Most-failed checklist items</h3><table><thead><tr><th>Question</th><th class="num">Fails</th></tr></thead><tbody>`;
  Q_FAILS.forEach(q=>h+=`<tr><td style="white-space:normal">${esc(q.q)}</td><td class="num">${q.n}</td></tr>`);
  h+=`</tbody></table></div>`;}
 h+=`<div class="box"><h3>Callbacks — most recent 60</h3>`;
 if(!INSP_CALLBACKS.length)h+=`<div class="empty">No callbacks recorded.</div>`;
 else{h+=`<table><thead><tr><th>Date</th><th>Source</th><th>Property</th><th>Unit</th><th>Housekeeper</th><th>Reason</th></tr></thead><tbody>`;
  INSP_CALLBACKS.slice(0,60).forEach(c=>h+=`<tr><td>${esc(c.date)}</td><td>${esc(c.src)}</td><td>${esc(c.prop)}</td>
  <td>${esc(c.unit)}</td><td>${esc(c.hk)}</td><td style="white-space:normal">${esc(c.reason)}</td></tr>`);
  h+=`</tbody></table>`;}
 h+=`</div>`;return h;}

/* ---------- UNITS ---------- */
function tUnits(){
 if(!UNIT_NPS.length)return `<div class="box"><div class="empty">No unit NPS data.</div></div>`;
 const worst=UNIT_NPS.slice(0,40);
 let h=`<div class="box"><h3>Lowest-scoring units — checkout NPS, last 90 days</h3><table><thead><tr>
 <th>Unit</th><th>Property</th><th class="num">NPS</th><th class="num">Responses</th><th class="num">Property avg</th></tr></thead><tbody>`;
 worst.forEach(u=>{const pa=PROP_AVGS[u.prop];
  h+=`<tr><td>${esc(u.unit)}</td><td>${bdg(u.prop)}${esc(u.prop)}</td>
  <td class="num" style="color:${npsCol(u.nps).color};font-weight:600">${u.nps}</td>
  <td class="num">${u.n}</td><td class="num" style="color:var(--mut)">${pa==null?"—":pa}</td></tr>`;});
 h+=`</tbody></table><div class="note">Units with more than 2 responses. ${UNIT_NPS.length} units qualify; the 40 lowest are shown.</div></div>`;
 return h;}

/* ---------- DELAY WEEK ---------- */
function tWeek(){
 let h=`<div class="box"><h3>Delay % by weekday — ${META.week_start} → ${META.week_end}</h3><table><thead><tr><th>Property</th>`;
 WD.forEach(d=>h+=`<th class="num">${d.slice(0,3)}</th>`);
 h+=`<th class="num">Week</th></tr></thead><tbody>`;
 DLY_PROPS.forEach(p=>{const w=WEEK_DATA[p]||{};let t=0,dd=0;
  h+=`<tr><td>${bdg(p)}${esc(p)}</td>`;
  WD.forEach(d=>{const c=w[d];if(c){t+=c.t;dd+=c.d;}
   h+=c?`<td class="cell" style="background:${dcol(c.pct).background};color:${dcol(c.pct).color}" title="${c.d}/${c.t}">${c.pct}%</td>`
       :`<td class="cell" style="background:#f3f3f1;color:#aaa">—</td>`;});
  const wp=t?Math.round(dd/t*100):null;
  h+=`<td class="cell" style="background:${dcol(wp).background};color:${dcol(wp).color};font-weight:700">${wp==null?"—":wp+"%"}</td></tr>`;});
 h+=`</tbody></table><div class="note">Hover a cell for delayed/total counts.</div></div>`;
 h+=`<div class="box"><h3>4-week rolling average by weekday — from ${META.roll4_start}</h3><table><thead><tr><th>Property</th>`;
 WD.forEach(d=>h+=`<th class="num">${d.slice(0,3)}</th>`);
 h+=`</tr></thead><tbody>`;
 DLY_PROPS.forEach(p=>{const r=ROLL4_DATA[p]||{};
  h+=`<tr><td>${bdg(p)}${esc(p)}</td>`;
  WD.forEach(d=>{const v=r[d];h+=dcell(v==null?null:v);});
  h+=`</tr>`;});
 h+=`</tbody></table></div>`;return h;}

/* ---------- DELAY TREND ---------- */
function tTrend(){
 let h=`<div class="box"><h3>Monthly delay % — ${DLY_MONTHS[0]} to ${DLY_MONTHS[DLY_MONTHS.length-1]}</h3><table><thead><tr><th>Property</th>`;
 DLY_MONTHS.forEach(m=>h+=`<th class="num">${m.slice(2)}</th>`);
 h+=`<th class="num">Trend</th></tr></thead><tbody>`;
 DLY_PROPS.forEach(p=>{const m=MTHLY_DATA[p]||{};
  h+=`<tr><td>${bdg(p)}${esc(p)}</td>`;
  DLY_MONTHS.forEach(k=>h+=dcell(m[k]==null?null:m[k]));
  const first=DLY_MONTHS.map(k=>m[k]).find(v=>v!=null);
  const last=[...DLY_MONTHS].reverse().map(k=>m[k]).find(v=>v!=null);
  const dl=(first!=null&&last!=null)?last-first:null;
  const c=dl==null?"var(--mut)":(dl>0?"var(--red)":dl<0?"var(--grn)":"var(--mut)");
  h+=`<td class="num" style="color:${c};font-weight:600">${dl==null?"—":(dl>0?"+":"")+dl+"pp"}</td></tr>`;});
 h+=`</tbody></table><div class="note">Trend compares the first and last month with data. ${CURRENT_MONTH} is partial.</div></div>`;
 return h;}

/* ---------- SHELL ---------- */
const TABS=[["Summary",tSummary],["Cleaners",tCleaners],["OTA ratings",tOta],["Inspections",tInsp],
 ["Checklist",tCheck],["Units",tUnits],["Delay — week",tWeek],["Delay — trend",tTrend]];
const tabsEl=document.getElementById("tabs"),panelsEl=document.getElementById("panels");
TABS.forEach(([name,fn],i)=>{
 const b=document.createElement("button");b.className="tab"+(i===0?" on":"");b.textContent=name;
 b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");document.getElementById("panel"+i).classList.add("on");};
 tabsEl.appendChild(b);
 const d=document.createElement("div");d.className="panel"+(i===0?" on":"");d.id="panel"+i;
 try{d.innerHTML=fn();}catch(e){d.innerHTML=`<div class="box"><div class="empty">Failed to render: ${esc(e.message)}</div></div>`;console.error(name,e);}
 panelsEl.appendChild(d);});

document.getElementById("refresh").onclick=async function(){
 this.disabled=true;this.textContent="Refreshing…";
 try{
  if(window.cowork&&window.cowork.runScheduledTask){
   await window.cowork.runScheduledTask("cleaning-quality-dashboard-monday-refresh");
   this.textContent="Refresh started";
  } else {this.textContent="Unavailable here";}
 }catch(e){console.error(e);this.textContent="Refresh failed";}
 setTimeout(()=>{this.disabled=false;this.textContent="Refresh data";},6000);};
console.log("cleaning-quality-dashboard loaded",{props:DLY_PROPS.length,months:DLY_MONTHS.length,
 cleaners:CLEANERS.length,ota:OTA_PROPS.length,callbacks:INSP_CALLBACKS.length,units:UNIT_NPS.length});
</script></body></html>
