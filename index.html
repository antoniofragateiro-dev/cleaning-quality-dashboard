function openCleanerDetail(cl){
  let h=`<h3>${cl.name}</h3><p style="color:var(--mut);font-size:13px">${dn(cl.property)}</p>`;
  h+=`<div class="kv"><span>Cleanings (90d)</span><span>${cl.count||'—'}</span></div>`;
  h+=`<div class="kv"><span>Cleanliness score</span><span>${cl.cleanliness_score!=null?Number(cl.cleanliness_score).toFixed(2):'—'}</span></div>`;
  h+=`<div class="kv"><span>Reviews</span><span>${cl.count_cleanliness||'—'}</span></div>`;
  h+=`<div class="kv"><span>NPS</span><span>${cl.nps!=null?Number(cl.nps).toFixed(0):'—'}</span></div>`;
  h+=`<div class="kv"><span>NPS responses</span><span>${cl.nps_n||'—'}</span></div>`;
  h+=`<div class="kv"><span>Avg rating</span><span>${cl.avg_rating!=null?Number(cl.avg_rating).toFixed(2):'—'}</span></div>`;
  if(cl.nps_n>=5){
    h+=`<div class="kv"><span>Promoters</span><span>${cl.promoters}</span></div>`;
    h+=`<div class="kv"><span>Detractors</span><span>${cl.detractors}</span></div>`;
  }
  if(window.cowork&&window.cowork.askClaude){
    h+=`<div class="ai" id="aiSummary">Loading AI summary...</div>`;
    pdBody.innerHTML=h;pd.classList.add('on');
    window.cowork.askClaude(
      `Summarise this cleaner's performance in 2-3 sentences. Name: ${cl.name}, Property: ${dn(cl.property)}, Cleanings: ${cl.count}, Cleanliness score: ${cl.cleanliness_score}, NPS: ${cl.nps} (n=${cl.nps_n}), Avg rating: ${cl.avg_rating}. Be direct and factual.`,
      []
    ).then(r=>{document.getElementById('aiSummary').textContent=r.content||r}).catch(()=>{document.getElementById('aiSummary').textContent='Summary unavailable'});
  } else {
    pdBody.innerHTML=h;pd.classList.add('on');
  }
}

  let latestAvg=latestVals.length>0?(latestVals.reduce((a,b)=>a+b,0)/latestVals.length).toFixed(1):'—';

  // High delay props
  const highDelay=props.filter(p=>{
    const w=WEEK_DATA[p]||{};let t=0,d=0;
    DOWS.forEach(day=>{if(w[day]){t+=w[day].t;d+=w[day].d}});
    return t>0&&(d/t*100)>=30;
  });

  // Callback rate
  const cbRate=Q_FAILS;

  let h='<div class="cards">';
  h+=`<div class="card"><div class="k">Properties</div><div class="v">${props.length}</div><div class="n">Numa: ${numaProps.length} · LSA: ${lsaProps.length}</div></div>`;
  h+=`<div class="card"><div class="k">HSK delay (last week)</div><div class="v">${wkPct}%</div><div class="n">Active reservation delays</div></div>`;
  h+=`<div class="card"><div class="k">Avg delay (${lastM})</div><div class="v">${latestAvg}%</div><div class="n">Monthly average</div></div>`;
  h+=`<div class="card"><div class="k">High delay props</div><div class="v">${highDelay.length}</div><div class="n">&ge;30% last week</div></div>`;
  h+=`<div class="card"><div class="k">Cleaners tracked</div><div class="v">${CLEANERS.length}</div><div class="n">Lisbon Numa (90d)</div></div>`;
  h+=`<div class="card"><div class="k">Checklist callbacks</div><div class="v">${cbRate}</div><div class="n">HSK return needed</div></div>`;
  h+='</div>';

  // Portfolio table
  h+=`<div class="box"><h3>Portfolio — last week vs month</h3><table><tr><th>Property</th><th class="num">Last week %</th>`;
  h+=`<th class="num">${lastM}</th><th class="num">${prevM}</th><th class="num">Trend</th></tr>`;
  props.forEach(p=>{
    const w=WEEK_DATA[p]||{};let t=0,d=0;
    DOWS.forEach(day=>{if(w[day]){t+=w[day].t;d+=w[day].d}});
    const wpct=t>0?(d/t*100):null;
    const po=PORTFOLIO[p]||{};
    const c=dc(wpct);
    const tc=dc(po.latest);
    const trend=po.trend||0;
    const tArr=trend>0?'&#9650;':trend<0?'&#9660;':'—';
    const tCol=trend>2?'var(--red)':trend<-2?'var(--grn)':'var(--mut)';
    h+=`<tr><td><span class="badge ${bg(p)}">${bl(p)}</span>${dn(p)}</td>`;
    h+=`<td class="cell" style="background:${c.bg};color:${c.fg}">${fmt(wpct)}</td>`;
    h+=`<td class="cell" style="background:${tc.bg};color:${tc.fg}">${fmt(po.latest)}</td>`;
    h+=`<td class="num">${fmt(po.prev)}</td>`;
    h+=`<td class="num" style="color:${tCol}">${tArr} ${Math.abs(trend).toFixed(1)}pp</td></tr>`;
  });
  h+='</table>';
  h+=`<div class="legend"><span><span class="sw" style="background:var(--tealbg)"></span>N = Numa</span><span><span class="sw" style="background:var(--orgbg)"></span>L = LSA</span>`;
  h+=`<span><span class="sw" style="background:#fee2e2"></span>&ge;30%</span><span><span class="sw" style="background:#fef3c7"></span>&ge;10%</span><span><span class="sw" style="background:#f0fdf4"></span>&lt;10%</span></div>`;
  h+=`<div class="note">HSK Delay (Active Res.) — % of cleaned units where SHINE flagged an HSK delay with an active guest reservation (Looker dashboard 431)</div>`;
  h+='</div>';
  el.innerHTML=h;
})();

// ===== TAB 2: CLEANERS =====
(function(){
  const el=document.getElementById('p-clean');
  if(!CLEANERS.length){el.innerHTML='<div class="empty">No cleaner data available</div>';return}
  let h='<div class="box"><h3>Cleaner scorecard — Lisbon Numa (90 days)</h3><table><tr><th>Cleaner</th><th>Property</th><th class="num">Cleanings</th><th class="num">Clean. score</th><th class="num">Reviews</th><th class="num">NPS</th><th class="num">Avg rating</th></tr>';
  CLEANERS.sort((a,b)=>(a.property||'').localeCompare(b.property)||((b.count||0)-(a.count||0)));
  CLEANERS.forEach(cl=>{
    const lowN=cl.count_cleanliness!=null&&cl.count_cleanliness<5;
    const npsCol=cl.nps!=null?(cl.nps>=50?'var(--grn)':cl.nps>=0?'var(--amb)':'var(--red)'):'var(--mut)';
    h+=`<tr class="clickable" onclick='openCleanerDetail(${JSON.stringify(cl).replace(/'/g,"\'")})'><td>${cl.name}${lowN?' <span style="color:var(--amb);font-size:11px">(low n)</span>':''}</td>`;
    h+=`<td>${dn(cl.property)}</td>`;
    h+=`<td class="num">${cl.count||'—'}</td>`;
    h+=`<td class="num">${cl.cleanliness_score!=null?Number(cl.cleanliness_score).toFixed(2):'—'}</td>`;
    h+=`<td class="num">${cl.count_cleanliness||'—'}</td>`;
    h+=`<td class="num" style="color:${npsCol};font-weight:600">${cl.nps!=null?Number(cl.nps).toFixed(0):'—'}</td>`;
    h+=`<td class="num">${cl.avg_rating!=null?Number(cl.avg_rating).toFixed(2):'—'}</td></tr>`;
  });
  h+='</table><div class="note">Click a row for detail. NPS = (promoters − detractors) / total × 100. Low n = fewer than 5 cleanliness reviews.</div></div>';
  el.innerHTML=h;
})();

// ===== TAB 3: OTA RATINGS =====
(function(){
  const el=document.getElementById('p-ota');
  if(!OTA_PROPS.length){el.innerHTML='<div class="empty">No OTA rating data</div>';return}
  // Show latest 6 months
  const months=OTA_MONTHS.slice(-6);
  let h='<div class="box"><h3>OTA ratings — cleanliness &amp; overall (last 6 months)</h3><table><tr><th>Property</th>';
  months.forEach(m=>h+=`<th class="num" colspan="2">${m}</th>`);
  h+='</tr><tr><th></th>';
  months.forEach(()=>h+='<th class="num" style="font-size:10px">Overall</th><th class="num" style="font-size:10px">Clean</th>');
  h+='</tr>';
  OTA_PROPS.forEach(p=>{
    h+=`<tr><td><span class="badge ${bg(p)}">${bl(p)}</span>${dn(p)}</td>`;
    months.forEach(m=>{
      const d=(OTA_DATA[p]||{})[m];
      if(d){
        const oc=d.overall!=null?(d.overall>=4.5?'var(--grn)':d.overall>=4?'var(--amb)':'var(--red)'):'var(--mut)';
        const cc=d.cleanliness!=null?(d.cleanliness>=4.5?'var(--grn)':d.cleanliness>=4?'var(--amb)':'var(--red)'):'var(--mut)';
        h+=`<td class="num" style="color:${oc}">${fmtR(d.overall)}</td>`;
        h+=`<td class="num" style="color:${cc}">${fmtR(d.cleanliness)}</td>`;
      } else {
        h+='<td class="num">—</td><td class="num">—</td>';
      }
    });
    h+='</tr>';
  });
  h+='</table><div class="note">Source: cosi/reservation OTA reviews. Colour: green &ge;4.50, amber &ge;4.00, red &lt;4.00.</div></div>';
  el.innerHTML=h;
})();

// ===== TAB 4: SHINE INSPECTIONS =====
(function(){
  const el=document.getElementById('p-insp');
  const months=INSP_MONTHS.slice(-3);
  const props=Object.keys(INSP_DATA).sort();
  if(!props.length){el.innerHTML='<div class="empty">No SHINE inspection data</div>';return}
  let h='<div class="box"><h3>SHINE inspection counts (last 3 months)</h3><table><tr><th>Property</th>';
  months.forEach(m=>h+=`<th class="num" colspan="2">${m}</th>`);
  h+='</tr><tr><th></th>';
  months.forEach(()=>h+='<th class="num" style="font-size:10px">Inspected</th><th class="num" style="font-size:10px">Cleaned</th>');
  h+='</tr>';
  props.forEach(p=>{
    h+=`<tr><td><span class="badge ${bg(p)}">${bl(p)}</span>${dn(p)}</td>`;
    months.forEach(m=>{
      const d=(INSP_DATA[p]||{})[m];
      if(d){
        const rate=d.cleaned>0?(d.inspected/d.cleaned*100).toFixed(0)+'%':'—';
        h+=`<td class="num">${d.inspected}</td><td class="num">${d.cleaned} <span style="color:var(--mut);font-size:11px">(${rate})</span></td>`;
      } else {
        h+='<td class="num">—</td><td class="num">—</td>';
      }
    });
    h+='</tr>';
  });
  h+='</table><div class="note">Inspected = units with TO_INSPECTION status. Cleaned = units with END_CLEANING. Lisbon uses TO_INSPECTION (cleaners skip END_CLEANING).</div></div>';
  el.innerHTML=h;
})();

// ===== TAB 5: CHECKLIST CALLBACKS =====
(function(){
  const el=document.getElementById('p-chk');
  if(!INSP_CALLBACKS.length){el.innerHTML='<div class="empty">No checklist callbacks recorded</div>';return}
  let h=`<div class="box"><h3>Checklist callbacks — HSK needs to return (${INSP_CALLBACKS.length} total)</h3><table><tr><th>Date</th><th>Property</th><th>Room</th><th>Housekeeper</th></tr>`;
  // Show most recent first
  const sorted=[...INSP_CALLBACKS].reverse();
  sorted.forEach(cb=>{
    h+=`<tr><td>${cb.ts?cb.ts.substring(0,10):''}</td><td>${cb.prop||''}</td><td>${cb.room||''}</td><td>${cb.hsk||''}</td></tr>`;
  });
  h+='</table><div class="note">Source: Google Sheets quality checklist (Anjos &amp; Rato). "No, HSK needs to come back" responses.</div></div>';
  el.innerHTML=h;
})();

// ===== TAB 6: UNIT NPS =====
(function(){
  const el=document.getElementById('p-unit');
  if(!UNIT_NPS.length){el.innerHTML='<div class="empty">No unit NPS data</div>';return}
  // Group by property
  const byProp={};
  UNIT_NPS.forEach(u=>{byProp[u.property]=byProp[u.property]||[];byProp[u.property].push(u)});
  let h='';
  Object.keys(byProp).sort().forEach(prop=>{
    const units=byProp[prop].sort((a,b)=>(b.nps||0)-(a.nps||0));
    const propAvg=PROP_AVGS[prop];
    h+=`<div class="box"><h3><span class="badge ${bg(prop)}">${bl(prop)}</span>${dn(prop)}`;
    if(propAvg!=null) h+=` <span style="font-weight:400;color:var(--mut);font-size:12px">Property NPS: ${Number(propAvg).toFixed(0)}</span>`;
    h+=`</h3><table><tr><th>Unit</th><th class="num">NPS</th><th class="num">Responses</th><th>Bar</th></tr>`;
    units.slice(0,15).forEach(u=>{
      const nps=u.nps!=null?Number(u.nps):null;
      const col=nps!=null?(nps>=50?'var(--grn)':nps>=0?'var(--amb)':'var(--red)'):'var(--mut)';
      const barW=nps!=null?Math.max(2,Math.min(100,(nps+100)/2)):0;
      h+=`<tr><td>${u.unit}</td><td class="num" style="color:${col};font-weight:600">${nps!=null?nps.toFixed(0):'—'}</td>`;
      h+=`<td class="num">${u.count||0}</td>`;
      h+=`<td><div class="bar" style="width:100px"><i style="width:${barW}%;background:${col}"></i></div></td></tr>`;
    });
    if(units.length>15) h+=`<tr><td colspan="4" style="color:var(--mut);font-size:12px">+${units.length-15} more units</td></tr>`;
    h+='</table></div>';
  });
  h+=`<div class="note">Unit NPS from checkout feedback (last 90 days, min 3 responses). NPS = (promoters − detractors) / total × 100.</div>`;
  el.innerHTML=h;
})();

// ===== TAB 7: WEEKLY HSK DELAY HEATMAP =====
(function(){
  const el=document.getElementById('p-heat');
  let h='<div class="box"><h3>HSK Delay (Active Res.) — week 2026-08-24 to 2026-08-31</h3>';
  h+=`<div style="font-size:12px;color:var(--mut);margin-bottom:10px">4-week rolling average shown in parentheses</div>`;
  h+='<table><tr><th>Property</th>';
  DOWS.forEach(d=>h+=`<th class="cell">${d.substring(0,3)}</th>`);
  h+='<th class="num">Week avg</th></tr>';
  DLY_PROPS.forEach(p=>{
    const w=WEEK_DATA[p]||{};
    const r4=ROLL4_DATA[p]||{};
    let wt=0,wd=0;
    h+=`<tr><td><span class="badge ${bg(p)}">${bl(p)}</span>${dn(p)}</td>`;
    DOWS.forEach(d=>{
      const v=w[d];
      const r=r4[d];
      if(v){
        wt+=v.t;wd+=v.d;
        const c=dc(v.pct);
        h+=`<td class="cell" style="background:${c.bg};color:${c.fg}" title="${v.d}/${v.t} delayed">${v.pct.toFixed(0)}%`;
        if(r!=null) h+=`<br><span style="font-size:10px;opacity:.7">(${r.toFixed(0)}%)</span>`;
        h+=`</td>`;
      } else {
        h+='<td class="cell" style="background:#f3f3f1;color:#aaa">—</td>';
      }
    });
    const wavg=wt>0?(wd/wt*100):null;
    const wc=dc(wavg);
    h+=`<td class="cell" style="background:${wc.bg};color:${wc.fg}">${fmt(wavg)}</td></tr>`;
  });
  h+='</table>';
  h+=`<div class="legend"><span><span class="sw" style="background:#fee2e2"></span>&ge;30% red</span><span><span class="sw" style="background:#fef3c7"></span>&ge;10% amber</span><span><span class="sw" style="background:#f0fdf4"></span>&lt;10% green</span></div>`;
  h+=`<div class="note">HSK Delay (Active Res.) = % of cleaned units where SHINE flagged an HSK delay with an active guest reservation. Tooltip shows delayed/total.</div>`;
  h+='</div>';
  el.innerHTML=h;
})();

// ===== TAB 8: MONTHLY HSK DELAY TREND =====
(function(){
  const el=document.getElementById('p-trend');
  // Table
  let h='<div class="box"><h3>Monthly HSK delay trend (2026)</h3><table><tr><th>Property</th>';
  DLY_MONTHS.forEach(m=>h+=`<th class="cell">${m.substring(5)}</th>`);
  h+='</tr>';
  DLY_PROPS.forEach(p=>{
    const m=MTHLY_DATA[p]||{};
    h+=`<tr><td><span class="badge ${bg(p)}">${bl(p)}</span>${dn(p)}</td>`;
    DLY_MONTHS.forEach(mo=>{
      const v=m[mo];
      const c=dc(v);
      h+=`<td class="cell" style="background:${c.bg};color:${c.fg}">${fmt(v)}</td>`;
    });
    h+='</tr>';
  });
  h+='</table>';
  h+=`<div class="note">Monthly % HSK Delay with Active Reservation. Same colour scale as weekly heatmap.</div></div>`;

  // Chart for Numa properties (Anjos + Rato)
  const numaP=DLY_PROPS.filter(p=>DLY_BRAND[p]==='Numa');
  if(numaP.length>0){
    h+=`<div class="box"><h3>Numa properties — monthly trend</h3><div class="chart-box"><canvas id="numaChart"></canvas></div></div>`;
  }
  // Chart for top LSA properties (by avg delay)
  const lsaP=DLY_PROPS.filter(p=>DLY_BRAND[p]==='LSA');
  if(lsaP.length>0){
    h+=`<div class="box"><h3>LSA portfolio — monthly trend (top 5 by avg delay)</h3><div class="chart-box"><canvas id="lsaChart"></canvas></div></div>`;
  }
  el.innerHTML=h;

  // Render charts
  const colors=['#0f766e','#c2410c','#2563eb','#9333ea','#dc2626','#ca8a04','#0891b2','#be185d'];
  if(numaP.length>0){
    const ctx=document.getElementById('numaChart');
    if(ctx){
      new Chart(ctx,{type:'line',data:{labels:DLY_MONTHS,datasets:numaP.map((p,i)=>({
        label:dn(p),data:DLY_MONTHS.map(m=>(MTHLY_DATA[p]||{})[m]??null),
        borderColor:colors[i%colors.length],backgroundColor:colors[i%colors.length]+'22',
        tension:.3,fill:false,pointRadius:3
      }))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},
      scales:{y:{beginAtZero:true,title:{display:true,text:'HSK Delay %'}},x:{title:{display:true,text:'Month'}}}}});
    }
  }
  if(lsaP.length>0){
    // Top 5 by average delay
    const lsaAvg=lsaP.map(p=>{
      const m=MTHLY_DATA[p]||{};
      const vals=DLY_MONTHS.map(mo=>m[mo]).filter(v=>v!=null);
      return{p,avg:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0};
    }).sort((a,b)=>b.avg-a.avg).slice(0,5);
    const ctx2=document.getElementById('lsaChart');
    if(ctx2){
      new Chart(ctx2,{type:'line',data:{labels:DLY_MONTHS,datasets:lsaAvg.map((x,i)=>({
        label:dn(x.p),data:DLY_MONTHS.map(m=>(MTHLY_DATA[x.p]||{})[m]??null),
        borderColor:colors[i%colors.length],backgroundColor:colors[i%colors.length]+'22',
        tension:.3,fill:false,pointRadius:3
      }))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},
      scales:{y:{beginAtZero:true,title:{display:true,text:'HSK Delay %'}},x:{title:{display:true,text:'Month'}}}}});
    }
  }
})();
</script>
</body></html>
