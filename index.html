function badge(p){const b=DLY_BRAND[p];return b==='LSA'?'<span class="badge bL">L</span>':'<span class="badge bN">N</span>';}

// ===== DETAIL PANEL =====
const pd=document.getElementById('panelDetail'),pdBody=document.getElementById('pdBody');
function openDetail(prop){
  document.getElementById('pdTitle').innerHTML=badge(prop)+prop;
  let h='';
  const wd=WEEK_DATA[prop]||{};
  const brand=DLY_BRAND[prop]||'?';
  const city=DLY_CITIES[prop]||'?';
  h+='<div class="kv"><span>Brand</span><span>'+brand+'</span></div>';
  h+='<div class="kv"><span>City</span><span>'+city+'</span></div>';
  const pt=Object.values(wd).reduce((a,v)=>a+v.t,0);
  const pd_=Object.values(wd).reduce((a,v)=>a+v.d,0);
  const pp=pt>0?(pd_/pt*100).toFixed(1)+'%':'--';
  h+='<div class="kv"><span>Week delay</span><span>'+pp+'</span></div>';
  h+='<div class="kv"><span>Cleaned units (week)</span><span>'+pt+'</span></div>';
  h+='<div class="kv"><span>Delayed units (week)</span><span>'+pd_+'</span></div>';
  const od=OTA_DATA[prop]||{};
  const lm=OTA_MONTHS.length?OTA_MONTHS[OTA_MONTHS.length-1]:null;
  if(lm&&od[lm]){
    h+='<div class="kv"><span>OTA overall ('+lm+')</span><span>'+fmtR(od[lm].overall)+'</span></div>';
    h+='<div class="kv"><span>OTA cleanliness ('+lm+')</span><span>'+fmtR(od[lm].clean)+'</span></div>';
    h+='<div class="kv"><span>Reviews ('+lm+')</span><span>'+od[lm].n+'</span></div>';
  }
  h+='<h4 style="margin:16px 0 8px;font-size:13px">Monthly HSK Delay (Active Res.)</h4>';
  const md=MTHLY_DATA[prop]||{};
  DLY_MONTHS.forEach(m=>{
    const v=md[m];
    const pct=v!=null?v.toFixed(1)+'%':'--';
    h+='<div class="kv"><span>'+m+'</span><span style="'+dlyColor(v)+'padding:1px 8px;border-radius:4px">'+pct+'</span></div>';
  });
  const units=UNIT_NPS_DATA[prop]||[];
  if(units.length){
    h+='<h4 style="margin:16px 0 8px;font-size:13px">Unit NPS (90d)</h4>';
    h+='<table><tr><th>Unit</th><th class="num">NPS</th><th class="num">N</th></tr>';
    units.sort((a,b)=>a.overall-b.overall).forEach(u=>{
      h+='<tr><td>'+u.unit+'</td><td class="num">'+fmtR(u.overall)+'</td><td class="num">'+u.n+'</td></tr>';
    });
    h+='</table>';
  }
  pdBody.innerHTML=h;
  pd.classList.add('on');
}

  h+='<div class="note">Anjos/Rato: column BH "HSK needs to come back" = callback. LSA: any category score &le;2 = callback. Last 30 responses checked.</div></div>';
  el.innerHTML=h;
})();

// ===== TAB 6: UNIT NPS =====
(function(){
  const el=document.getElementById('p-unit');
  const props=Object.keys(UNIT_NPS_DATA).sort();
  if(!props.length){el.innerHTML='<div class="empty">No unit-level NPS data available</div>';return;}
  let h='';
  props.forEach(p=>{
    const units=UNIT_NPS_DATA[p]||[];
    if(!units.length) return;
    h+='<div class="box"><h3>'+badge(p)+p+' — unit NPS (90 days)</h3>';
    h+='<table><tr><th>Unit</th><th class="num">NPS</th><th class="num">Reviews</th></tr>';
    units.sort((a,b)=>a.overall-b.overall).forEach(u=>{
      const v=u.overall;
      const bg=v>=50?'var(--grnbg)':v>=0?'var(--ambbg)':'var(--redbg)';
      const fg=v>=50?'var(--grn)':v>=0?'var(--amb)':'var(--red)';
      h+='<tr><td>'+u.unit+'</td>';
      h+='<td class="cell" style="background:'+bg+';color:'+fg+'">'+v.toFixed(0)+'</td>';
      h+='<td class="num">'+u.n+'</td></tr>';
    });
    h+='</table></div>';
  });
  h+='<div class="note">Source: checkout_feedback_data NPS. 90-day window, min 3 reviews. Sorted by NPS ascending (worst first).</div>';
  el.innerHTML=h;
})();

// ===== TAB 7: WEEKLY HSK DELAY HEATMAP =====
(function(){
  const el=document.getElementById('p-heat');
  let h='<div class="box"><h3>HSK Delay (Active Res.) — week of 2026-08-24</h3>';
  h+='<div style="overflow-x:auto"><table><tr><th>Property</th>';
  DOWS.forEach(d=>h+='<th class="num">'+d.slice(0,3)+'</th>');
  h+='<th class="num">Week</th></tr>';
  const sorted=DLY_PROPS.slice().sort((a,b)=>(PROP_WEEK_DELAY[b]||0)-(PROP_WEEK_DELAY[a]||0));
  sorted.forEach(p=>{
    h+='<tr class="clickable" onclick="openDetail(\''+p.replace(/'/g,"\\'")+'\')"><td>'+badge(p)+p+'</td>';
    let wt=0,wd_=0;
    DOWS.forEach(d=>{
      const v=WEEK_DATA[p]&&WEEK_DATA[p][d];
      if(v){
        wt+=v.t;wd_+=v.d;
        h+='<td class="cell" style="'+dlyColor(v.pct)+'" title="'+v.d+'/'+v.t+' cleaned">'+fmt(v.pct)+'</td>';
      } else h+='<td class="cell" style="color:#ccc">--</td>';
    });
    const wp=wt>0?(wd_/wt*100).toFixed(1):0;
    h+='<td class="cell" style="'+dlyColor(parseFloat(wp))+';font-weight:700">'+wp+'%</td>';
    h+='</tr>';
  });
  h+='</table></div>';
  h+='<div class="legend"><span><span class="sw" style="background:var(--grnbg)"></span>&lt;10%</span><span><span class="sw" style="background:var(--ambbg)"></span>10-29%</span><span><span class="sw" style="background:var(--redbg)"></span>&gt;=30%</span></div>';
  h+='<div class="note">Metric: % of cleaned units where first completion was at 15:00 or later. Source: shine_task_processed_s.</div></div>';
  h+='<div class="box"><h3>Rolling 4-week avg by weekday (2026-08-03 to 2026-08-31)</h3>';
  h+='<div style="overflow-x:auto"><table><tr><th>Property</th>';
  DOWS.forEach(d=>h+='<th class="num">'+d.slice(0,3)+'</th>');
  h+='</tr>';
  sorted.forEach(p=>{
    h+='<tr><td>'+badge(p)+p+'</td>';
    DOWS.forEach(d=>{
      const v=ROLL4_DATA[p]&&ROLL4_DATA[p][d];
      h+='<td class="cell" style="'+dlyColor(v!=null?v:null)+'">'+(v!=null?v.toFixed(1)+'%':'--')+'</td>';
    });
    h+='</tr>';
  });
  h+='</table></div></div>';
  el.innerHTML=h;
})();

// ===== TAB 8: MONTHLY HSK DELAY TREND =====
(function(){
  const el=document.getElementById('p-trend');
  let h='<div class="box"><h3>Monthly HSK Delay trend — 2026</h3>';
  h+='<div style="overflow-x:auto"><table><tr><th>Property</th>';
  DLY_MONTHS.forEach(m=>h+='<th class="num">'+m.slice(5)+'</th>');
  h+='</tr>';
  DLY_PROPS.forEach(p=>{
    h+='<tr class="clickable" onclick="openDetail(\''+p.replace(/'/g,"\\'")+'\')"><td>'+badge(p)+p+'</td>';
    DLY_MONTHS.forEach(m=>{
      const md=MTHLY_DATA[p]||{};
      const v=md[m];
      h+='<td class="cell" style="'+dlyColor(v!=null?v:null)+'">'+(v!=null?v.toFixed(1)+'%':'--')+'</td>';
    });
    h+='</tr>';
  });
  h+='</table></div>';
  h+='<div class="legend"><span><span class="sw" style="background:var(--grnbg)"></span>&lt;10%</span><span><span class="sw" style="background:var(--ambbg)"></span>10-29%</span><span><span class="sw" style="background:var(--redbg)"></span>&gt;=30%</span></div>';
  h+='<div class="note">Source: shine_task_processed_s, monthly aggregation. Jan-Sep 2026.</div></div>';
  h+='<div class="box"><h3>Numa properties — monthly trend</h3><div class="chart-box"><canvas id="numaTrendChart"></canvas></div></div>';
  h+='<div class="box"><h3>LSA properties — monthly trend</h3><div class="chart-box"><canvas id="lsaTrendChart"></canvas></div></div>';
  el.innerHTML=h;
  const numaPs=DLY_PROPS.filter(p=>DLY_BRAND[p]==='Numa');
  const colors=['#0f766e','#0ea5e9','#8b5cf6','#ec4899','#f59e0b'];
  new Chart(document.getElementById('numaTrendChart'),{
    type:'line',
    data:{labels:DLY_MONTHS,datasets:numaPs.map((p,i)=>({
      label:p,data:DLY_MONTHS.map(m=>(MTHLY_DATA[p]&&MTHLY_DATA[p][m]!=null)?MTHLY_DATA[p][m]:null),
      borderColor:colors[i%colors.length],tension:.3,pointRadius:3,spanGaps:true
    }))},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},
      scales:{y:{beginAtZero:true,ticks:{callback:v=>v+'%'}}}}
  });
  const lsaPs=DLY_PROPS.filter(p=>DLY_BRAND[p]==='LSA');
  const lastM=DLY_MONTHS[DLY_MONTHS.length-1];
  const lsaSorted=lsaPs.slice().sort((a,b)=>((MTHLY_DATA[b]&&MTHLY_DATA[b][lastM])||0)-((MTHLY_DATA[a]&&MTHLY_DATA[a][lastM])||0));
  const lsaTop=lsaSorted.slice(0,8);
  const lColors=['#c2410c','#dc2626','#7c3aed','#2563eb','#059669','#d97706','#db2777','#4f46e5'];
  new Chart(document.getElementById('lsaTrendChart'),{
    type:'line',
    data:{labels:DLY_MONTHS,datasets:lsaTop.map((p,i)=>({
      label:p.replace('LSA ',''),
      data:DLY_MONTHS.map(m=>(MTHLY_DATA[p]&&MTHLY_DATA[p][m]!=null)?MTHLY_DATA[p][m]:null),
      borderColor:lColors[i%lColors.length],tension:.3,pointRadius:3,spanGaps:true
    }))},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},
      scales:{y:{beginAtZero:true,ticks:{callback:v=>v+'%'}}}}
  });
})();
</script>
</body></html>
